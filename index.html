<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0c0c"><meta name="description" content="An independent information architecture course with worked examples, research practice, navigation design and optional private voice tutoring."><title>Information architecture</title><link rel="stylesheet" href="lms.css"><link rel="stylesheet" href="content-theme.css"><script src="vendor/marked.umd.js" defer></script><script src="lesson-markdown.js" defer></script><script src="lms-runtime.js" defer></script><script src="voice-config.js" defer></script><script src="voice-access.js" defer></script><script src="voice.js" defer></script></head><body class="lms-export-body"><div id="lms-root"></div><script id="lms-course-data" type="application/json">{"schemaVersion": 1, "id": "information-architecture-course-v1", "title": "Information architecture", "description": "Organise information, write useful labels, research structures and design navigation. Follow NN/g’s IA reading path with original practice and an applied project.", "sections": [{"id": "start", "type": "section", "title": "1 Start", "children": [{"id": "welcome", "type": "slides", "title": "Use this course", "slides": [{"id": "welcome-1", "title": "Learn to organise information", "body": "By the end, you should be able to propose an information structure, choose meaningful labels, plan research, interpret finding problems and specify navigation. Reading every slide is completion; applying and testing the decisions provides stronger evidence of learning."}, {"id": "welcome-2", "title": "Follow the reading path", "body": "Start here, then work through Principles, Research and Navigation in the order recommended by NN/g. The final applied workshops connect those ideas to an end-to-end project. All lessons remain available if you need to jump to a specific question."}, {"id": "welcome-3", "title": "Work in small sessions", "body": "Choose one lesson and complete its practice before moving on. Use your notes to record an answer, uncertainty and next check. Return later and explain the idea without rereading. Short slides make delivery manageable; they do not guarantee understanding."}, {"id": "welcome-4", "title": "Understand the sources", "body": "This independent course uses original explanations, fictional examples and exercises. It is not an official NN/g course or a reproduction of its publications. External readings open in a new tab. Video pages were reviewed through their available summaries; video transcripts were not available."}, {"id": "welcome-5", "title": "Use voice as a study tool", "body": "On Vercel, private sign-in reveals the microphone icon. The tutor receives the current slide heading and text, not a view of your screen or private notes. Ask it to explain a term, challenge a decision or read the slide. API usage is billed separately."}, {"id": "welcome-6", "title": "Keep your work", "body": "Progress and notes stay in this browser. Use the report and copy/export controls for a separate record. Practical exercises are self-assessed; quizzes check selected concepts and do not certify professional competence."}], "sourceIds": ["guide"]}, {"id": "cedar-brief", "type": "slides", "title": "Choose your practice project", "slides": [{"id": "cedar-brief-1", "title": "Meet Cedar Community Centre", "body": "Cedar is a fictional service offering classes, events, membership, swimming, room hire and support. New visitors need to understand what exists. Returning members need quick routes to bookings, preparation, cancellation and fee information."}, {"id": "cedar-brief-2", "title": "Use this starting inventory", "body": "| ID | Content | Current location |\n| --- | --- | --- |\n| C1 | Pottery for beginners | Activities |\n| C2 | Course dates and fees | Downloads |\n| C3 | Cancel a booking | Member zone |\n| C4 | Reduced fees | About |\n| C5 | Accessible facilities | Footer |\n| C6 | Hire a room | Other |"}, {"id": "cedar-brief-3", "title": "Add enough variety", "body": "Include swimming age limits, tutor profiles, contact details, opening hours, events, equipment loans, membership renewal, venue directions and booking preparation. These authored items give you ambiguity and different tasks to investigate. They are not findings from actual Cedar users."}, {"id": "cedar-brief-4", "title": "Define success before redesign", "body": "Choose three outcomes: a newcomer finds an affordable evening class; a member checks cancellation conditions; a visitor determines whether a venue meets access needs. Write what information would demonstrate success for each."}, {"id": "cedar-brief-5", "title": "Record assumptions", "body": "For each task, write what you know, what you assume and what evidence you need. If using your own site, replace Cedar with a manageable area while preserving important content types and tasks."}, {"id": "cedar-brief-6", "title": "Save a baseline", "body": "Keep your starting structure and labels. Later you will compare them with a revised structure using equivalent tasks. Do not silently rewrite your baseline after you see the results."}], "sourceIds": []}, {"id": "start-check", "type": "quiz", "title": "Check: Start", "skill": "Check: Start", "questions": [{"id": "start-check-q1", "prompt": "What would demonstrate more than slide completion?", "options": ["Memorising the number of menu items", "Testing a proposed structure with realistic tasks", "Opening every slide quickly"], "answer": 1, "explanation": "Applied evidence is stronger than a record of viewing content."}, {"id": "start-check-q2", "prompt": "Which is a useful project goal?", "options": ["A newcomer finds cancellation conditions", "The site has exactly six categories", "Every page has a shorter title"], "answer": 0, "explanation": "Define a useful outcome before choosing a structure."}, {"id": "start-check-q3", "prompt": "What does the voice tutor receive?", "options": ["All private notes automatically", "A live visual view of every browser tab", "The supplied current slide heading and text"], "answer": 2, "explanation": "The app supplies slide text; screen pixels and private notes are excluded."}]}]}, {"id": "structure", "type": "section", "title": "2 Structure and organisation", "children": [{"id": "topic-30", "type": "slides", "title": "Separate structure from navigation", "slides": [{"id": "topic-30-1", "title": "Define the underlying structure", "body": "Learn to distinguish an information architecture from its visible controls. IA defines what content and functions exist, their relationships and the names used to describe them."}, {"id": "topic-30-2", "title": "Choose the right deliverable", "body": "An inventory records what exists. An audit evaluates it. A sitemap describes relationships. A navigation specification describes how people move through the interface. These documents answer different questions."}, {"id": "topic-30-3", "title": "Design structure before choosing controls", "body": "A menu is one view of an information space. Start with its content and complexity, then prototype suitable controls. A visually attractive menu cannot repair missing content or confusing categories."}, {"id": "topic-30-4", "title": "Worked example", "body": "At Cedar Community Centre, “Membership” contains eligibility, prices and renewal. That relationship is IA. Displaying those destinations in a sidebar is navigation. Giving the renewal button a green background is visual design."}, {"id": "topic-30-5", "title": "Try it in your notes", "body": "Classify these decisions in your notes: merge duplicate price pages; add a breadcrumb; rename “Member services” to “Membership”; increase button padding. Which require understanding the content?"}, {"id": "topic-30-6", "title": "Review your answer", "body": "Merging and naming are IA decisions. The breadcrumb is navigation; padding is visual/interaction design. They influence each other. Explain the user need behind each decision rather than treating disciplines as isolated boxes."}, {"id": "topic-30-7", "title": "Read the original", "body": "[The Difference Between Information Architecture (IA) and Navigation](https://www.nngroup.com/articles/ia-vs-navigation/)"}], "sourceIds": ["nng-30"], "guideOrder": 1}, {"id": "topic-31", "type": "slides", "title": "Model one system in different ways", "slides": [{"id": "topic-31-1", "title": "Compare three views", "body": "Learn when to use a full IA structure, a taxonomy and a navigation model. The structure describes relationships; a taxonomy controls classification; navigation exposes useful routes."}, {"id": "topic-31-2", "title": "Do not force identical models", "body": "A navigation menu need not display every taxonomy term or every page. Background classification can support related content and search without becoming a top-level menu."}, {"id": "topic-31-3", "title": "Keep models connected", "body": "Give content stable identifiers so the same item can appear in several views. Document which categories, terms and controls refer to that item."}, {"id": "topic-31-4", "title": "Worked example", "body": "Cedar has one pottery course record. Its IA parent is Courses. Its metadata includes subject “Arts”, level “Beginner” and venue “West hall”. Navigation exposes Courses and a subject filter, without adding West hall to the main menu."}, {"id": "topic-31-5", "title": "Try it in your notes", "body": "Describe a beginner coding workshop in three views: its home in the IA, three classification fields, and a visible route to find it."}, {"id": "topic-31-6", "title": "Review your answer", "body": "One possible answer: Courses / Computing / Beginner coding; subject Computing, level Beginner, delivery In person; Courses menu plus subject and level filters. Check that your views all identify the same record. This is an authored example, not a universal model."}, {"id": "topic-31-7", "title": "Read the original", "body": "[Information Architecture: 3 Key Models (Video)](https://www.nngroup.com/videos/information-architecture-models/)"}], "sourceIds": ["nng-31"], "guideOrder": 2}, {"id": "topic-32", "type": "slides", "title": "Distinguish finding from discovering", "slides": [{"id": "topic-32-1", "title": "Recognise the two goals", "body": "Findability concerns something people expect to exist. Discoverability concerns something they encounter without already knowing about it. A product can support one and neglect the other."}, {"id": "topic-32-2", "title": "Match the research question", "body": "A task that explicitly names a feature tests finding it. It does not show whether someone would notice that feature during ordinary activity."}, {"id": "topic-32-3", "title": "Support both behaviours", "body": "Provide direct routes for known needs and relevant contextual routes for unfamiliar offerings. Do not confuse promotional visibility with useful discovery."}, {"id": "topic-32-4", "title": "Worked example", "body": "A member searches for “renew membership”: a finding task. While viewing renewal, they notice reduced fees for carers: discovery. A separate, relevant eligibility link could support that discovery without interrupting renewal."}, {"id": "topic-32-5", "title": "Try it in your notes", "body": "Choose an expected service and a useful unfamiliar service at Cedar. Write a task to test the first and an observation scenario for the second."}, {"id": "topic-32-6", "title": "Review your answer", "body": "Ask someone to find opening hours. Separately, observe a realistic booking task and see whether they notice accessibility support. Avoid mentioning the support feature in advance if your question is unaided discovery."}, {"id": "topic-32-7", "title": "Read the original", "body": "[Findability vs. Discoverability (Video)](https://www.nngroup.com/videos/findability-vs-discoverability/)"}], "sourceIds": ["nng-32"], "guideOrder": 3}, {"id": "topic-33", "type": "slides", "title": "Strengthen information scent", "slides": [{"id": "topic-33-1", "title": "Predict the destination", "body": "Information scent is the evidence people use to predict whether a route will answer their question. It depends on their current goal, not a link’s wording alone."}, {"id": "topic-33-2", "title": "Align the cues", "body": "The label, accompanying description, surrounding context and previous experience all influence expectations. The destination should fulfil the promise made by those cues."}, {"id": "topic-33-3", "title": "Avoid misleading attraction", "body": "A tempting label can increase clicks while producing disappointment. Judge whether people reach useful content and complete their task, not whether a link attracts attention."}, {"id": "topic-33-4", "title": "Worked example", "body": "“Discover possibilities” offers weak evidence for someone seeking a refund. “Cancel a class and request a refund” predicts the task. Placing it in Booking help strengthens the surrounding context."}, {"id": "topic-33-5", "title": "Try it in your notes", "body": "Write two labels for Cedar’s cancellation policy. For each, predict what a member would expect after selecting it. Then compare the destination’s heading and opening paragraph."}, {"id": "topic-33-6", "title": "Review your answer", "body": "“Class cancellation and refunds” is a plausible label if both topics are present. “Get your money back” is misleading if refunds depend on a deadline. Preserve the condition in nearby text and test expectations with readers."}, {"id": "topic-33-7", "title": "Read the original", "body": "[Information Scent: How Users Decide Where to Go Next](https://www.nngroup.com/articles/information-scent/)"}], "sourceIds": ["nng-33"], "guideOrder": 4}, {"id": "topic-34", "type": "slides", "title": "Make search and browsing work together", "slides": [{"id": "topic-34-1", "title": "Use complementary routes", "body": "Search helps people with a specific query. Navigation exposes the scope of a site and helps people who do not yet know its vocabulary. The balance depends on users and content."}, {"id": "topic-34-2", "title": "Reduce recall demands", "body": "Typing a query requires remembering or inventing terms. Browsing lets people recognise available options. Search also depends on result quality and recovery from poor queries."}, {"id": "topic-34-3", "title": "Reconnect results to structure", "body": "A result should provide enough context to understand its type and location. Let people continue browsing relevant categories after arriving through search."}, {"id": "topic-34-4", "title": "Worked example", "body": "A returning learner searches “pottery Tuesday”. A newcomer browses Courses / Arts because they do not know Cedar’s class names. Both reach the same course record and can inspect related classes."}, {"id": "topic-34-5", "title": "Try it in your notes", "body": "List three queries for a workshop and two browse routes. Include a synonym and a misspelling. What happens when there are no matching results?"}, {"id": "topic-34-6", "title": "Review your answer", "body": "An authored plan could map “coding” and “programming” to the same subject, preserve the query on an empty state and offer related categories. Test actual retrieval before claiming that synonyms or spelling correction work."}, {"id": "topic-34-7", "title": "Read the original", "body": "[Search Box vs. Navigation (Video)](https://www.nngroup.com/videos/search-box-vs-navigation/)"}], "sourceIds": ["nng-34"], "guideOrder": 5}, {"id": "topic-35", "type": "slides", "title": "Choose menu size from the content", "slides": [{"id": "topic-35-1", "title": "Reject a magic item count", "body": "A menu does not become usable simply by containing seven options. Its size should reflect content breadth and the difficulty of recognising meaningful categories."}, {"id": "topic-35-2", "title": "Evaluate the actual options", "body": "Consider how distinct and familiar labels are, how much space the pattern provides, and whether people can scan the list. Splitting or combining categories creates tradeoffs."}, {"id": "topic-35-3", "title": "Test representative tasks", "body": "Try finding common and less common items. Watch hesitation, mistaken choices and backtracking. Use that evidence to refine grouping rather than meeting an arbitrary count."}, {"id": "topic-35-4", "title": "Worked example", "body": "Cedar has five services today. Adding childcare and venue hire could justify more visible categories. Hiding them under “Other” solely to keep five links would reduce the evidence available to visitors."}, {"id": "topic-35-5", "title": "Try it in your notes", "body": "Propose two top-level menus for Cedar: one with broad groups and one with more specific groups. Predict which tasks each might make harder."}, {"id": "topic-35-6", "title": "Review your answer", "body": "“Activities” may be compact but ambiguous between classes and events. Separate Courses and Events may be easier to recognise. A proposed menu is a hypothesis; compare it using the same tasks and representative participants."}, {"id": "topic-35-7", "title": "Read the original", "body": "[How Many Items in a Navigation Menu? (Video)](https://www.nngroup.com/videos/number-items-navigation-menu/)"}], "sourceIds": ["nng-35"], "guideOrder": 6}, {"id": "topic-36", "type": "slides", "title": "Balance breadth and depth", "slides": [{"id": "topic-36-1", "title": "Compare structural tradeoffs", "body": "A broad hierarchy has more choices at each level; a deep hierarchy has more levels. Both can create effort: scanning many choices or repeatedly deciding where to go next."}, {"id": "topic-36-2", "title": "Separate structure from presentation", "body": "A multi-level hierarchy can be exposed through a mega menu or through successive category pages. Visible clicks do not directly reveal the underlying structure’s depth."}, {"id": "topic-36-3", "title": "Preserve meaningful groups", "body": "Prefer categories people understand over an artificially flat or deep structure. Check information scent along the whole route, not just at the first level."}, {"id": "topic-36-4", "title": "Worked example", "body": "One design lists 40 Cedar classes at the top. Another hides Pottery below Activities / Personal development / Creative skills / Arts. A middle option exposes Courses, then Arts, with course links and filters."}, {"id": "topic-36-5", "title": "Try it in your notes", "body": "Take twelve pieces of content and create a broad version and a deeper version. Choose three tasks, then identify where the visitor must make an uncertain decision."}, {"id": "topic-36-6", "title": "Review your answer", "body": "Your explanation should identify a concrete ambiguous label or overcrowded list. “Fewer clicks is always better” does not justify the choice. Keep the candidate structures for a later tree test."}, {"id": "topic-36-7", "title": "Read the original", "body": "[Flat vs. Deep Website Hierarchies](https://www.nngroup.com/articles/flat-vs-deep-hierarchy/)"}], "sourceIds": ["nng-36"], "guideOrder": 7}, {"id": "topic-37", "type": "slides", "title": "Audit common architecture failures", "slides": [{"id": "topic-37-1", "title": "Check the structure", "body": "Look for absent organisation, disconnected search, missing category landing pages, excessive cross-listing and isolated subsites. These failures prevent people building a useful mental model."}, {"id": "topic-37-2", "title": "Check navigation behaviour", "body": "Inspect hidden choices, hard-to-control menus, inconsistency, competing navigation mechanisms and invented labels. Structure and controls need to support the same understanding."}, {"id": "topic-37-3", "title": "Prioritise by consequence", "body": "An audit identifies potential problems; it does not establish how often each occurs. Investigate important tasks and record evidence, impact and a proposed next check."}, {"id": "topic-37-4", "title": "Worked example", "body": "Cedar’s bookings open on a separate branded site with no route back. Its courses menu disappears there. A member cannot tell whether “Enrichment” contains their class. These are connected integration, consistency and naming problems."}, {"id": "topic-37-5", "title": "Try it in your notes", "body": "Audit your practice site using the ten failure types across the previous two slides. For each issue, record the affected task, observed evidence and a validation method."}, {"id": "topic-37-6", "title": "Review your answer", "body": "Example entry: “Cancel booking: members cannot locate the external provider’s help; observed in two sessions; add a consistent support route and retest.” Distinguish observed failures from expert-review hypotheses."}, {"id": "topic-37-7", "title": "Read the original", "body": "[Top 10 Information Architecture (IA) Mistakes](https://www.nngroup.com/articles/top-10-ia-mistakes/)"}], "sourceIds": ["nng-37"], "guideOrder": 8}, {"id": "topic-38", "type": "slides", "title": "Decide menu count, order and activation", "slides": [{"id": "topic-38-1", "title": "Choose a meaningful order", "body": "Order categories using the task and context: importance, frequency, sequence or another meaningful scheme. Alphabetical order works best when people already know the terms they seek."}, {"id": "topic-38-2", "title": "Make breadth intentional", "body": "Use enough categories to represent the offering clearly. Broad sites may need more options and a different navigation pattern, rather than compressed or ambiguous labels."}, {"id": "topic-38-3", "title": "Provide alternatives to hover", "body": "A hover menu needs usable touch and keyboard access. Do not make essential destinations depend on a pointer interaction that some people cannot perform."}, {"id": "topic-38-4", "title": "Worked example", "body": "Cedar puts Book a class before its corporate history because booking is a common task. Its full tutor directory is alphabetical because visitors often know a tutor’s name. The same site uses different schemes for different purposes."}, {"id": "topic-38-5", "title": "Try it in your notes", "body": "Choose an ordering scheme for courses, tutor names and booking steps. Explain why one universal ordering scheme would be unhelpful."}, {"id": "topic-38-6", "title": "Review your answer", "body": "Subject groups can organise courses, alphabetical names can organise tutors, and chronological steps can organise booking. These choices still require recognisable labels and usable access on touch and keyboard."}, {"id": "topic-38-7", "title": "Read the original", "body": "[Top 3 IA Questions about Navigation Menus](https://www.nngroup.com/articles/ia-questions-navigation-menus/)"}], "sourceIds": ["nng-38"], "guideOrder": 9}, {"id": "topic-39", "type": "slides", "title": "Replace the three-click rule with evidence", "slides": [{"id": "topic-39-1", "title": "Avoid arbitrary limits", "body": "There is no universal three-click threshold for successful navigation. Click count ignores comprehension, waiting, errors and the complexity of the task."}, {"id": "topic-39-2", "title": "Inspect effort between clicks", "body": "A short route can still require scanning a huge list. A longer route can feel straightforward when each choice has a clear purpose and provides orientation."}, {"id": "topic-39-3", "title": "Choose useful measures", "body": "Combine task success with time, mistakes, backtracking and observed confusion. Reduce unnecessary work without flattening meaningful structure just to meet a number."}, {"id": "topic-39-4", "title": "Worked example", "body": "Version A reaches a Cedar refund policy in two clicks through a page of 120 links. Version B takes four clear steps through Booking help and Cancellations. Counting steps alone cannot identify the better experience."}, {"id": "topic-39-5", "title": "Try it in your notes", "body": "Write a small evaluation plan comparing the two routes. Include a success definition and at least two effort measures."}, {"id": "topic-39-6", "title": "Review your answer", "body": "Define success as finding the correct refund conditions and identifying the applicable deadline. Record time and wrong turns, then ask what was confusing. Keep task wording and content consistent across versions."}, {"id": "topic-39-7", "title": "Read the original", "body": "[The 3-Click Rule for Navigation Is False](https://www.nngroup.com/articles/3-click-rule/)"}], "sourceIds": ["nng-39"], "guideOrder": 10}, {"id": "topic-40", "type": "slides", "title": "Use polyhierarchy for real ambiguity", "slides": [{"id": "topic-40-1", "title": "Understand multiple parents", "body": "Polyhierarchy lets an item belong to more than one category. It can support people who reasonably expect the same content in different places."}, {"id": "topic-40-2", "title": "Keep one maintained item", "body": "Multiple routes do not require duplicate content pages. Use a stable canonical record and link it from each justified category to avoid conflicting versions."}, {"id": "topic-40-3", "title": "Limit cross-listing", "body": "Listing everything everywhere weakens categories and can confuse location cues. Use research to justify alternate routes and define a consistent breadcrumb policy."}, {"id": "topic-40-4", "title": "Worked example", "body": "Cedar’s family swimming class is relevant under Swimming and Family activities. Both links can open the same course page. Two independently edited pages could disagree about age limits or fees."}, {"id": "topic-40-5", "title": "Try it in your notes", "body": "Identify one item that genuinely belongs under two Cedar categories. Explain who benefits, how you would test the routes and how the item would be maintained."}, {"id": "topic-40-6", "title": "Review your answer", "body": "A reasonable proposal uses observed expectations, one content record and explicit category relationships. Do not add a second category merely because it is technically possible; inspect whether people actually look there."}, {"id": "topic-40-7", "title": "Read the original", "body": "[Polyhierarchies Improve Findability for Ambiguous IA Categories](https://www.nngroup.com/articles/polyhierarchy/)"}], "sourceIds": ["nng-40"], "guideOrder": 11}, {"id": "topic-41", "type": "slides", "title": "Turn cross-listing into an implementation rule", "slides": [{"id": "topic-41-1", "title": "Connect the concept to a system", "body": "A polyhierarchical item has more than one parent relationship. Plan the data and interface together so alternate routes remain understandable."}, {"id": "topic-41-2", "title": "Preserve orientation", "body": "Decide whether breadcrumbs follow a canonical path or an appropriate contextual path. Keep the decision consistent and avoid presenting a visitor’s click history as the site hierarchy."}, {"id": "topic-41-3", "title": "Review the extra relationships", "body": "Every cross-listing adds maintenance work. Check alternate routes after content moves, and remove relationships that no longer support a useful expectation."}, {"id": "topic-41-4", "title": "Worked example", "body": "Record COURSE-17 once, with parent relationships to Swimming and Family activities. Its canonical URL stays unchanged. A navigation specification states how each entry route will display location context."}, {"id": "topic-41-5", "title": "Try it in your notes", "body": "Draft a three-row specification: content identifier, allowed parent categories and breadcrumb policy. Add one edge case involving entry from an external search engine."}, {"id": "topic-41-6", "title": "Review your answer", "body": "For direct entry, a stable canonical breadcrumb can provide context even without a previous category click. Other policies can work, but must avoid misleading visitors and be tested. Multiple parents are not permission to duplicate inconsistent facts."}, {"id": "topic-41-7", "title": "Read the original", "body": "[Polyhierarchy in Information Architecture (Video)](https://www.nngroup.com/videos/polyhierarchy-information-architecture/)"}], "sourceIds": ["nng-41"], "guideOrder": 12}, {"id": "topic-42", "type": "slides", "title": "Handle category outliers without overengineering", "slides": [{"id": "topic-42-1", "title": "Recognise imperfect membership", "body": "People’s categories can tolerate a few loosely fitting items. An outlier does not automatically require a new top-level category or an empty-looking subcategory."}, {"id": "topic-42-2", "title": "Compare the alternatives", "body": "Keep the item in a broader group, introduce a useful subcategory, use metadata for alternate discovery, or cross-list where expectations justify it."}, {"id": "topic-42-3", "title": "Consider scale and evidence", "body": "The amount of content, distinct user needs and expected growth affect the choice. A theoretically pure classification can be harder to use than a practical one."}, {"id": "topic-42-4", "title": "Worked example", "body": "Cedar has twenty regular courses and one equipment-loan guide. A separate “Learning enablement solutions” section adds an unfamiliar category. A recognisable Equipment loans link within course support may fit better."}, {"id": "topic-42-5", "title": "Try it in your notes", "body": "Choose a location for a single bursary guide. Compare a new Fees and funding subcategory with a direct link from course pages. What future change would alter your decision?"}, {"id": "topic-42-6", "title": "Review your answer", "body": "If funding content grows into several distinct tasks, a dedicated category may become useful. With one guide, a clear support location and contextual links could suffice. Record the hypothesis and test finding the guide."}, {"id": "topic-42-7", "title": "Read the original", "body": "[How to Handle Category Outliers in Your IA](https://www.nngroup.com/articles/ia-category-outliers/)"}], "sourceIds": ["nng-42"], "guideOrder": 13}, {"id": "structure-check", "type": "quiz", "title": "Check: Structure and organisation", "skill": "Check: Structure and organisation", "questions": [{"id": "structure-check-q1", "prompt": "Cedar changes a page’s parent category. What changed?", "options": ["The information architecture", "Only its colour palette", "Only its animation"], "answer": 0, "explanation": "Parent relationships are part of the structure."}, {"id": "structure-check-q2", "prompt": "A four-step route is clearer than a two-step list of 200 links. What should you do?", "options": ["Reject it because four clicks is forbidden", "Hide links until only seven remain", "Evaluate success and effort with tasks"], "answer": 2, "explanation": "Click count alone ignores scanning and decision effort."}, {"id": "structure-check-q3", "prompt": "Two audiences reasonably seek the same guide in different categories. What is a defensible option?", "options": ["List every page under every category", "Research-supported cross-listing of one maintained item", "Copy the guide into two independent pages"], "answer": 1, "explanation": "Polyhierarchy can support genuine alternate expectations without duplicate content."}, {"id": "structure-check-q4", "prompt": "One outlier loosely fits a large category. What should happen next?", "options": ["Compare practical locations and test expectations", "Always create a new top-level section", "Delete the item to preserve mathematical purity"], "answer": 0, "explanation": "Small numbers of outliers do not automatically require new categories."}]}]}, {"id": "labels", "type": "section", "title": "3 Labels and taxonomy", "children": [{"id": "topic-43", "type": "slides", "title": "Write labels with the four Ss", "slides": [{"id": "topic-43-1", "title": "Make labels specific and sincere", "body": "Specific labels identify the destination. Sincere labels set expectations the destination fulfils. Avoid promises that the content or function cannot meet."}, {"id": "topic-43-2", "title": "Make labels substantial", "body": "A label should carry enough meaning to be understood when scanned apart from surrounding text. Preserve distinguishing words instead of relying entirely on nearby copy."}, {"id": "topic-43-3", "title": "Keep labels succinct", "body": "Remove words that add no useful distinction. Brevity supports scanning only while the subject, action and important conditions remain understandable."}, {"id": "topic-43-4", "title": "Worked example", "body": "“Free courses” is inaccurate when only eligible members receive a waiver. “Course fee support” is more sincere. A short description can explain eligibility before the visitor commits to applying."}, {"id": "topic-43-5", "title": "Try it in your notes", "body": "Evaluate “Discover”, “Everything about our exciting programmes” and “Evening language courses” against all four Ss. Rewrite the first two for a specific destination."}, {"id": "topic-43-6", "title": "Review your answer", "body": "For a language course directory, “Evening language courses” names subject and schedule without a vague invitation. For an application page, “Apply for course fee support” states the actual action. Confirm each label against its destination."}, {"id": "topic-43-7", "title": "Read the original", "body": "[Better Labels for Website Links: the 4 Ss for Encouraging clicks (Video)](https://www.nngroup.com/videos/better-link-labels/)"}], "sourceIds": ["nng-43"], "guideOrder": 14}, {"id": "topic-44", "type": "slides", "title": "Replace ambiguous Learn more links", "slides": [{"id": "topic-44-1", "title": "Identify the destination", "body": "A standalone “Learn more” label gives little evidence about the next page. Repetition makes scanning and distinguishing links harder, including for assistive technology users."}, {"id": "topic-44-2", "title": "Choose meaningful linked text", "body": "Link an informative phrase in the surrounding sentence or write a short destination label. Include format or external-service details when they affect the decision."}, {"id": "topic-44-3", "title": "Preserve relevant context", "body": "Descriptive links do not require long labels everywhere. A clear subject and destination can be concise; supporting text can explain conditions without replacing the link’s meaning."}, {"id": "topic-44-4", "title": "Worked example", "body": "Three Cedar cards all end “Learn more”. Replace them with “Compare membership prices”, “Check swimming age limits” and “Find accessible facilities”. Each now predicts a different destination."}, {"id": "topic-44-5", "title": "Try it in your notes", "body": "Write links for a fee table, a cancellation form on another provider’s site and an accessibility policy PDF. Decide what context belongs beside each link."}, {"id": "topic-44-6", "title": "Review your answer", "body": "Possible labels: “Membership prices”, “Cancel a booking on Cedar Bookings” and “Accessibility policy (PDF)”. Add file size only if known and useful. Do not claim that a link submits a cancellation when it merely opens a form."}, {"id": "topic-44-7", "title": "Read the original", "body": "[“Learn More” Links: You Can Do Better](https://www.nngroup.com/articles/learn-more-links/)"}], "sourceIds": ["nng-44"], "guideOrder": 15}, {"id": "topic-45", "type": "slides", "title": "Avoid three patterns of weak naming", "slides": [{"id": "topic-45-1", "title": "Replace vague invitations", "body": "Navigation labels such as “Explore” or “Connect” often conceal the subject. Choose words that help people predict the content or function."}, {"id": "topic-45-2", "title": "Do not force verbal symmetry", "body": "Making every menu item a verb or the same grammatical shape can remove useful meaning. Clarity matters more than decorative consistency."}, {"id": "topic-45-3", "title": "Keep personality out of the way", "body": "Conversational labels can be friendly yet ambiguous. Use natural language where it helps, while retaining the concrete nouns people need for finding information."}, {"id": "topic-45-4", "title": "Worked example", "body": "“Discover / Thrive / Belong” could mean courses, wellbeing services or membership. “Courses / Wellbeing support / Membership” gives visitors more useful distinctions without preventing a welcoming tone elsewhere."}, {"id": "topic-45-5", "title": "Try it in your notes", "body": "Rewrite Cedar’s menu “Get inspired / Get connected / Get going”. State what content each replacement represents before choosing the wording."}, {"id": "topic-45-6", "title": "Review your answer", "body": "Possible replacements are Events, Contact and Book a class, if those are the actual destinations. A naming exercise cannot resolve undefined categories: establish what each group contains first."}, {"id": "topic-45-7", "title": "Read the original", "body": "[3 Common IA Mistakes (that Are All Due to Low Information Scent)](https://www.nngroup.com/articles/3-ia-mistakes/)"}], "sourceIds": ["nng-45"], "guideOrder": 16}, {"id": "topic-46", "type": "slides", "title": "Build a controlled taxonomy", "slides": [{"id": "topic-46-1", "title": "Control classification terms", "body": "A taxonomy defines an approved hierarchical vocabulary for classifying content. It differs from free-form tags and from the menu visitors see."}, {"id": "topic-46-2", "title": "Relate the models", "body": "A content model defines types and fields. The IA defines the information space. Taxonomy supplies classification rules; navigation uses selected relationships and labels. Thesauri add term relationships; ontologies model richer domain relationships."}, {"id": "topic-46-3", "title": "Build and govern the vocabulary", "body": "Inventory terms, involve content experts and users, define preferred terms and scope, test retrieval and assign ownership. Prevent uncontrolled additions from producing duplicate or conflicting categories."}, {"id": "topic-46-4", "title": "Worked example", "body": "Cedar’s subject vocabulary permits Computing, Languages and Arts. Editors cannot independently add “IT”, “Tech skills” and “Digital” as competing subjects. Search synonyms can still map those expressions to Computing."}, {"id": "topic-46-5", "title": "Try it in your notes", "body": "Create a small subject taxonomy with two levels. For one term, write a definition, inclusion/exclusion rule, synonym and owner. Classify three real content items."}, {"id": "topic-46-6", "title": "Review your answer", "body": "Example: Computing includes learning to use or program digital systems, excludes equipment hire, has search synonym IT, and is owned by the course editor. If editors disagree, revise scope notes and test retrieval before expanding the vocabulary."}, {"id": "topic-46-7", "title": "Read the original", "body": "[Taxonomy 101: Definition, Best Practices, and How It Complements Other IA Work](https://www.nngroup.com/articles/taxonomy-101/)"}], "sourceIds": ["nng-46"], "guideOrder": 17}, {"id": "labels-check", "type": "quiz", "title": "Check: Labels and taxonomy", "skill": "Check: Labels and taxonomy", "questions": [{"id": "labels-check-q1", "prompt": "Which label best predicts a fee-comparison destination?", "options": ["Compare membership prices", "Discover more", "Begin your journey"], "answer": 0, "explanation": "The label names the subject and purpose."}, {"id": "labels-check-q2", "prompt": "Editors create IT, Digital and Computing as overlapping tags. What is missing?", "options": ["More animated menu icons", "A shorter domain name", "Vocabulary rules and ownership"], "answer": 2, "explanation": "Controlled terms and scope definitions prevent uncontrolled classification."}, {"id": "labels-check-q3", "prompt": "A Free courses label opens a page of conditional discounts. What needs checking?", "options": ["Whether every word begins with a capital", "Whether the label sets truthful expectations", "Whether it has enough enthusiasm"], "answer": 1, "explanation": "Sincere labels must match the destination and its conditions."}, {"id": "labels-check-q4", "prompt": "Must every navigation category begin with a verb?", "options": ["No; use the clearest meaningful labels", "Yes; verbs guarantee conversion", "Only on phone screens"], "answer": 0, "explanation": "Forced grammatical symmetry can weaken information scent."}]}]}, {"id": "cards", "type": "section", "title": "4 Card sorting", "children": [{"id": "topic-49", "type": "slides", "title": "Run a useful card sort", "slides": [{"id": "topic-49-1", "title": "Discover how people group content", "body": "Card sorting asks participants to organise representative topics. It reveals grouping expectations and vocabulary; it does not directly prove that people can find content in the resulting interface."}, {"id": "topic-49-2", "title": "Prepare and pilot", "body": "Define the research question, recruit relevant participants and create understandable, representative cards. Pilot the instructions and workload. The current NN/g article suggests roughly 30–50 cards; adjust scope to the study rather than treating this as a requirement."}, {"id": "topic-49-3", "title": "Run and interpret", "body": "Let people sort without teaching your preferred structure. Capture their labels, uncertainty and reasoning. Review agreement, differences and outliers alongside content constraints before proposing an IA."}, {"id": "topic-49-4", "title": "Worked example", "body": "Cedar includes course prices, joining instructions, venue access, refunds and tutor profiles. An open sort reveals that some participants group refunds with bookings rather than with membership. That expectation needs investigation, not automatic acceptance."}, {"id": "topic-49-5", "title": "Try it in your notes", "body": "Create twelve practice cards from Cedar’s content. Ask someone to group and label them without suggesting categories. Record one surprising grouping and their explanation."}, {"id": "topic-49-6", "title": "Review your answer", "body": "Your twelve-card activity is a learning exercise, not a validated research sample. Keep the original grouping and the participant’s words. Propose a structural change and a later tree-test task to check it."}, {"id": "topic-49-7", "title": "Read the original", "body": "[Card Sorting: Uncover Users' Mental Models](https://www.nngroup.com/articles/card-sorting-definition/)"}], "sourceIds": ["nng-49"], "guideOrder": 18}, {"id": "topic-50", "type": "slides", "title": "Choose open, closed or hybrid sorting", "slides": [{"id": "topic-50-1", "title": "Use open sorting to explore", "body": "In an open sort, participants create and name groups. Use it when you need to learn possible organisational schemes and language rather than evaluate only your existing categories."}, {"id": "topic-50-2", "title": "Use closed sorting to examine a proposal", "body": "A closed sort supplies categories and asks participants to place cards within them. It helps investigate whether items and labels fit people’s expectations, but does not test an entire navigation journey."}, {"id": "topic-50-3", "title": "Make hybrid rules explicit", "body": "A hybrid approach permits predefined groups and additional groups. Explain what participants may change, and distinguish evidence about existing categories from new proposals."}, {"id": "topic-50-4", "title": "Worked example", "body": "Cedar has not agreed on its course-support categories, so an open sort can explore expectations. Later, a closed sort can examine whether cancellation, payment and preparation topics fit proposed category names."}, {"id": "topic-50-5", "title": "Try it in your notes", "body": "Choose a sorting approach for a new site, a disputed label and an established taxonomy with possible gaps. Explain what you would still need to test afterwards."}, {"id": "topic-50-6", "title": "Review your answer", "body": "Open sorting can explore a new structure; closed sorting can investigate a proposal; hybrid sorting can reveal gaps while preserving a starting scheme. None establishes visual menu usability. Use task-based evaluation for finding and interaction."}, {"id": "topic-50-7", "title": "Read the original", "body": "[Open vs. Closed Card Sorting (Video)](https://www.nngroup.com/videos/open-vs-closed-card-sorting/)"}], "sourceIds": ["nng-50"], "guideOrder": 19}, {"id": "topic-51", "type": "slides", "title": "Prevent keyword matching from masquerading as insight", "slides": [{"id": "topic-51-1", "title": "Test concepts, not repeated words", "body": "Participants may group cards by matching words rather than by understanding the content. Repeated department names or prefixes can manufacture agreement."}, {"id": "topic-51-2", "title": "Write neutral descriptions", "body": "Use clear, distinct wording that describes each item’s meaning. Remove accidental verbal patterns without making the cards cryptic or changing what they represent."}, {"id": "topic-51-3", "title": "Inspect the reasoning", "body": "Pilot cards for comprehension and ask why people grouped them. Revise ambiguous wording before interpreting large amounts of sorting data."}, {"id": "topic-51-4", "title": "Worked example", "body": "“Member prices”, “Member conduct” and “Member stories” share a prefix but support different needs. Cedar can describe them as “Membership fees”, “Rules for using facilities” and “Experiences shared by members” to reduce superficial matching."}, {"id": "topic-51-5", "title": "Try it in your notes", "body": "Rewrite six cards that begin with a repeated organisational term. Ask a participant to explain one group. Could the new wording still be steering the answer?"}, {"id": "topic-51-6", "title": "Review your answer", "body": "Removing a prefix alone is insufficient if the replacement adds an obvious category cue. Check equivalent detail and neutral phrasing across cards. Record whether the participant discusses meaning or simply repeats a shared word."}, {"id": "topic-51-7", "title": "Read the original", "body": "[Card Sorting: Pushing Users Beyond Terminology Matches](https://www.nngroup.com/articles/card-sorting-terminology-matches/)"}], "sourceIds": ["nng-51"], "guideOrder": 20}, {"id": "topic-52", "type": "slides", "title": "Plan the participant sample", "slides": [{"id": "topic-52-1", "title": "Treat sample size as a decision", "body": "NN/g’s older card-sorting article recommends about 15 participants for many projects and more for larger studies. This is contextual guidance from limited evidence, not a guarantee or a universal minimum for every research question."}, {"id": "topic-52-2", "title": "Represent relevant differences", "body": "Recruit people who reflect the intended users and meaningful knowledge differences. A large convenience sample cannot repair recruitment that excludes an important audience."}, {"id": "topic-52-3", "title": "Separate exploration from measurement", "body": "Small moderated studies can reveal reasons and issues. Stable quantitative comparisons need a suitable sample and analysis plan. Explain uncertainty and avoid presenting a few responses as population facts."}, {"id": "topic-52-4", "title": "Worked example", "body": "A Cedar study with fifteen staff members may reveal staff vocabulary but miss newcomer expectations. Recruiting new and returning members addresses a different problem from merely increasing the total number."}, {"id": "topic-52-5", "title": "Try it in your notes", "body": "Write a recruitment plan naming the audience, important differences, recruitment route, available sample and limitations. What would you do if only five people were available?"}, {"id": "topic-52-6", "title": "Review your answer", "body": "Use a small sample for exploratory learning, retain disagreements and plan follow-up. Do not report “80% of all members prefer this” from four of five participants. Distinguish a pilot from a reliable estimate."}, {"id": "topic-52-7", "title": "Read the original", "body": "[Card Sorting: How Many Users to Test](https://www.nngroup.com/articles/card-sorting-how-many-users-to-test/)"}], "sourceIds": ["nng-52"], "guideOrder": 21}, {"id": "topic-53", "type": "slides", "title": "Reduce sampling and material bias", "slides": [{"id": "topic-53-1", "title": "Represent the content fairly", "body": "The cards you select shape the apparent categories. Overrepresenting one subject can make it appear more important or more subdivided than the real collection."}, {"id": "topic-53-2", "title": "Check selection rules", "body": "Define the inventory and how cards represent it. Include important tasks, less common items and likely outliers without loading the study to support a stakeholder’s desired answer."}, {"id": "topic-53-3", "title": "Pilot the whole experience", "body": "Review wording, card order, instructions and facilitation. Avoid coaching, approval signals and category hints. Record exclusions so others understand the study’s limits."}, {"id": "topic-53-4", "title": "Worked example", "body": "Cedar selects twenty arts cards but only one swimming card, although both represent similar shares of the offering. The results may split Arts into many groups while concealing distinctions within Swimming."}, {"id": "topic-53-5", "title": "Try it in your notes", "body": "Audit your practice card set. List included content types, excluded topics and the reason for each. Identify one imbalance that could change the result."}, {"id": "topic-53-6", "title": "Review your answer", "body": "A defensible selection reflects the research question and content space. Proportionate sampling is a starting point, not a rule that rare but critical tasks must disappear. Document deliberate oversampling and analyse it accordingly."}, {"id": "topic-53-7", "title": "Read the original", "body": "[How to Avoid Bias in Card Sorting (Video)](https://www.nngroup.com/videos/bias-card-sorting/)"}], "sourceIds": ["nng-53"], "guideOrder": 22}, {"id": "topic-54", "type": "slides", "title": "Interpret clusters and dendrograms", "slides": [{"id": "topic-54-1", "title": "Read a cluster as evidence", "body": "A dendrogram visualises how items cluster under an analysis method. It summarises patterns of grouping; it is not an automatically correct sitemap."}, {"id": "topic-54-2", "title": "Compare candidate boundaries", "body": "Inspect which items consistently belong together and which move between groups. The merge scale and algorithm depend on the tool, so read its definitions before interpreting a cut or distance."}, {"id": "topic-54-3", "title": "Combine numbers with meaning", "body": "Review participant labels, comments, outliers and content needs. Different defensible cuts can produce different numbers of categories. Validate the proposed structure through finding tasks."}, {"id": "topic-54-4", "title": "Worked example", "body": "In a fictional Cedar sort, Prices and Concessions are grouped together by 18 of 20 participants; Refunds joins them in only 8. The stronger pair suggests a Fees cluster, while Refunds needs further investigation."}, {"id": "topic-54-5", "title": "Try it in your notes", "body": "Use this small similarity table: A with B: 90%; A with C: 35%; B with C: 40%. Propose a group and one uncertainty. What information is missing?"}, {"id": "topic-54-6", "title": "Review your answer", "body": "A and B are plausible companions. The table alone does not name the group or explain C’s role. You need item meanings, sample details, other relationships and participant reasoning. A visual cluster does not eliminate design judgement."}, {"id": "topic-54-7", "title": "Read the original", "body": "[How to Interpret Dendrograms from Card Sorting to Improve Information Architecture (Video)](https://www.nngroup.com/videos/ia-dendrogram/)"}], "sourceIds": ["nng-54"], "guideOrder": 23}, {"id": "cards-check", "type": "quiz", "title": "Check: Card sorting", "skill": "Check: Card sorting", "questions": [{"id": "cards-check-q1", "prompt": "You need to explore possible category names. Choose:", "options": ["A click count of the existing menu", "Open card sorting", "A closed sort with unchangeable department names"], "answer": 1, "explanation": "An open sort lets participants group and name content."}, {"id": "cards-check-q2", "prompt": "Cards all begin with Member. What risk arises?", "options": ["Keyword matching may substitute for conceptual grouping", "Every participant will necessarily fail", "The vocabulary is proven correct"], "answer": 0, "explanation": "Repeated wording can manufacture agreement."}, {"id": "cards-check-q3", "prompt": "Twenty cards cover arts and one covers swimming despite similar collections. Investigate:", "options": ["Whether the interface needs more shadows", "Whether all participants used identical devices", "Whether selection bias distorts the groupings"], "answer": 2, "explanation": "Card selection shapes the patterns that can emerge."}, {"id": "cards-check-q4", "prompt": "A dendrogram displays a strong cluster. What follows?", "options": ["Ignore all participant comments", "Interpret its meaning and test a proposed structure", "Copy it directly into production as the final sitemap"], "answer": 1, "explanation": "Clusters summarise data and require contextual interpretation."}]}]}, {"id": "trees", "type": "section", "title": "5 Tree testing and diagnosis", "children": [{"id": "topic-55", "type": "slides", "title": "Use tree testing to check findability", "slides": [{"id": "topic-55-1", "title": "Evaluate the proposed hierarchy", "body": "A tree test presents a stripped-down category structure and asks people where they would find something. It isolates naming and grouping from visual interface design."}, {"id": "topic-55-2", "title": "Choose the question carefully", "body": "Use tasks that expose disputed categories and important destinations. Define acceptable locations in advance, including justified alternate paths."}, {"id": "topic-55-3", "title": "Know what remains untested", "body": "A good tree result does not establish that a real menu is visible, operable or accessible. Test the interface separately after testing the structure."}, {"id": "topic-55-4", "title": "Worked example", "body": "Cedar asks where a member would find the rules for recovering a payment after cancelling a class. The participant chooses among labels without seeing promotional cards, page styling or search."}, {"id": "topic-55-5", "title": "Try it in your notes", "body": "Convert one uncertainty from your card sort into a tree-test task. Describe the acceptable destination without copying the category name into the task."}, {"id": "topic-55-6", "title": "Review your answer", "body": "“You cannot attend a booked class. Where would you check whether your payment can be returned?” avoids directly saying “Refund policy”. Keep the scenario short and use language participants understand."}, {"id": "topic-55-7", "title": "Read the original", "body": "[Tree Testing to Evaluate Information Architecture Categories (Video)](https://www.nngroup.com/videos/tree-testing/)"}], "sourceIds": ["nng-55"], "guideOrder": 24}, {"id": "topic-56", "type": "slides", "title": "Prepare, pilot and run a tree test", "slides": [{"id": "topic-56-1", "title": "Define the tree and answers", "body": "Include relevant categories down to the task destinations. Decide what counts as success before collecting results. A shallow tree can hide lower-level problems."}, {"id": "topic-56-2", "title": "Write unbiased tasks", "body": "Select common tasks, important risks and areas of disagreement. Avoid giving away category labels or burying the goal in a long story. Pilot the tasks for comprehension."}, {"id": "topic-56-3", "title": "Choose the study mode", "body": "Moderated sessions can reveal reasoning; unmoderated studies can collect broader behavioural data. Decide recruitment, sample, task order, data exclusions and reporting before launch."}, {"id": "topic-56-4", "title": "Worked example", "body": "A Cedar test includes booking, cancellation, accessibility support and venue hire. Each task has an expected destination and accepted alternate routes. A pilot discovers that “concession” is misunderstood, so the task wording is revised."}, {"id": "topic-56-5", "title": "Try it in your notes", "body": "Write a mini protocol: research question, tree version, participants, three tasks, accepted destinations and exclusion rules. Pilot one task without explaining the intended answer."}, {"id": "topic-56-6", "title": "Review your answer", "body": "A complete protocol makes your decisions reproducible. Record wording changes after the pilot. Avoid changing success criteria after seeing results merely to improve the score. Follow with interface testing once the hierarchy is promising."}, {"id": "topic-56-7", "title": "Read the original", "body": "[Tree Testing: Evaluate Menu Labels and Categories](https://www.nngroup.com/articles/tree-testing/)"}], "sourceIds": ["nng-56"], "guideOrder": 25}, {"id": "topic-57", "type": "slides", "title": "Turn tree-test results into changes", "slides": [{"id": "topic-57-1", "title": "Separate success from effort", "body": "Success records acceptable final destinations. Directness concerns the route and backtracking; time adds another effort measure. A correct final answer can conceal considerable difficulty."}, {"id": "topic-57-2", "title": "Inspect pathways", "body": "Weak first choices suggest a top-level expectation problem. Good first choices followed by wrong destinations suggest trouble further down. Examine distributions and accepted alternate paths, not just one overall percentage."}, {"id": "topic-57-3", "title": "Compare fairly", "body": "Interpret results by task importance, baseline and uncertainty. Compare equivalent tasks and recruitment. A small numerical difference is not automatically meaningful; quantitative comparisons need an appropriate sample and analysis."}, {"id": "topic-57-4", "title": "Worked example", "body": "Fictional data: 20 participants try Cedar cancellation. 14 succeed; 8 succeed directly; 6 succeed after backtracking; 6 fail. That is 70% success and 40% direct success using all participants as denominator. State that denominator explicitly."}, {"id": "topic-57-5", "title": "Try it in your notes", "body": "Half the participants start under Membership, but refunds live under Bookings. Propose two competing explanations and a next test. Do not assume the most popular wrong route must become correct."}, {"id": "topic-57-6", "title": "Review your answer", "body": "The top label may be unclear, or visitors may reasonably view refunds as a membership issue. Inspect other task paths, interview evidence and category overlap. Try clearer labels or justified cross-listing, then retest. Tool definitions of directness can differ."}, {"id": "topic-57-7", "title": "Read the original", "body": "[Tree Testing Part 2: Interpreting the Results](https://www.nngroup.com/articles/interpreting-tree-test-results/)"}], "sourceIds": ["nng-57"], "guideOrder": 26}, {"id": "topic-58", "type": "slides", "title": "Diagnose IA problems separately from interface problems", "slides": [{"id": "topic-58-1", "title": "Use four complementary methods", "body": "Tree testing evaluates paths through a hierarchy. Closed sorting examines category fit. Click testing examines selection in a visual design. Usability testing observes a fuller task in context."}, {"id": "topic-58-2", "title": "Compare evidence across methods", "body": "If a labelled hierarchy works but the real page fails, investigate visibility and interaction. If both fail, investigate structure and wording as well. Neither pattern proves a cause on its own."}, {"id": "topic-58-3", "title": "Choose the smallest useful next study", "body": "Start from an observed task failure and a specific hypothesis. Match the method to the uncertainty rather than running every method automatically."}, {"id": "topic-58-4", "title": "Worked example", "body": "Cedar visitors find accessibility information in a text tree but overlook its low-contrast link in the page footer. A visual click test and observed task can examine whether presentation explains the difference."}, {"id": "topic-58-5", "title": "Try it in your notes", "body": "Match a method to each question: Do these labels fit the topics? Which visible link looks right? Can someone complete booking? Can they find the destination in a stripped hierarchy?"}, {"id": "topic-58-6", "title": "Review your answer", "body": "Use closed sorting, click testing, usability testing and tree testing respectively. Each answers part of the problem. For example, selecting a plausible first link does not establish successful end-to-end booking."}, {"id": "topic-58-7", "title": "Read the original", "body": "[Low Findability and Discoverability: Four Testing Methods to Identify the Causes](https://www.nngroup.com/articles/navigation-ia-tests/)"}], "sourceIds": ["nng-58"], "guideOrder": 27}, {"id": "trees-check", "type": "quiz", "title": "Check: Tree testing and diagnosis", "skill": "Check: Tree testing and diagnosis", "questions": [{"id": "trees-check-q1", "prompt": "A tree task says Find the Refund policy category. What is the concern?", "options": ["Tree tests cannot include policies", "The task gives away the label being evaluated", "The task is too short to be valid"], "answer": 1, "explanation": "Test the underlying need without unnecessarily priming the category term."}, {"id": "trees-check-q2", "prompt": "18 of 20 find the page, but 12 backtrack. What matters?", "options": ["Success hides substantial effort", "The IA is necessarily perfect", "Only total clicks should be reported"], "answer": 0, "explanation": "Combine success with pathways, directness and time."}, {"id": "trees-check-q3", "prompt": "The text hierarchy works but visitors miss the real menu. Next investigate:", "options": ["Only adding more categories", "Only increasing the study’s success threshold", "Visual visibility and interaction as well as remaining IA questions"], "answer": 2, "explanation": "A tree test isolates structure and does not validate interface visibility."}, {"id": "trees-check-q4", "prompt": "A participant selects the correct branch first, then the wrong leaf. Inspect:", "options": ["Only how many top-level categories exist", "Lower-level labels and category boundaries", "Only the homepage logo position"], "answer": 1, "explanation": "The path suggests where to investigate; it does not establish a cause by itself."}]}]}, {"id": "global", "type": "section", "title": "6 Global navigation", "children": [{"id": "topic-59", "type": "slides", "title": "Review menus with the current checklist", "slides": [{"id": "topic-59-1", "title": "Make choices visible", "body": "The study guide names a 15-point checklist; its linked article now contains 17 guidelines. Review visibility, expected placement, contrast and menus that preserve surrounding page context."}, {"id": "topic-59-2", "title": "Communicate place and options", "body": "Indicate the current location and relevant neighbouring pages. Use familiar, front-loaded labels, scannable alignment and suitable access to deeper levels. Optional visual cues support rather than replace text."}, {"id": "topic-59-3", "title": "Make menus operable", "body": "Provide usable targets, clear submenu signifiers and reliable touch/keyboard alternatives to hover. Avoid cascading fly-outs, unnecessary pointer travel and novelty. Consider access on long pages without obstructing content."}, {"id": "topic-59-4", "title": "Worked example", "body": "Cedar’s menu looks elegant but uses pale text, hides all subjects under an icon and closes when the pointer briefly leaves a narrow target. A structural review alone would miss these interaction failures."}, {"id": "topic-59-5", "title": "Try it in your notes", "body": "Review your menu under four headings: visibility, location, options and manipulation. Select three high-impact changes and explain the task each would improve."}, {"id": "topic-59-6", "title": "Review your answer", "body": "Example: expose Courses on desktop; mark the current course section; open submenus through a keyboard-operable button. Recheck actual tasks after changing the interface. A checklist identifies risks, not a certificate of usability."}, {"id": "topic-59-7", "title": "Read the original", "body": "[Menu-Design Checklist: 17 UX Guidelines](https://www.nngroup.com/articles/menu-design/)"}], "sourceIds": ["nng-59"], "guideOrder": 28}, {"id": "topic-60", "type": "slides", "title": "Make navigation noticeable", "slides": [{"id": "topic-60-1", "title": "Design for recognition", "body": "A menu must be noticed before it can help. Placement, contrast, styling and visible labels influence whether visitors recognise available routes."}, {"id": "topic-60-2", "title": "Respect familiar locations", "body": "Put important navigation where users are likely to look. Avoid making ordinary choices resemble advertising or decorative content."}, {"id": "topic-60-3", "title": "Verify in context", "body": "Inspect the page at realistic sizes and during realistic tasks. Do not assume the designer’s knowledge of where a menu lives will transfer to a newcomer."}, {"id": "topic-60-4", "title": "Worked example", "body": "Cedar puts course categories inside a photographic banner with no contrasting background. Visitors scan past them as promotion. Moving the same labels into the normal header gives clearer evidence that they are navigation."}, {"id": "topic-60-5", "title": "Try it in your notes", "body": "Show a page briefly to someone unfamiliar with it. Ask where they would begin finding a class. Record what they noticed before explaining the design."}, {"id": "topic-60-6", "title": "Review your answer", "body": "If they point to search or an unrelated card, investigate why. The observation suggests a question; it does not prove a single cause. Compare a version with clearer positioning and styling using equivalent tasks."}, {"id": "topic-60-7", "title": "Read the original", "body": "[Navigation Menus - 5 Tips to Make Them Visible (Video)](https://www.nngroup.com/videos/navigation-menu-visibility/)"}], "sourceIds": ["nng-60"], "guideOrder": 29}, {"id": "topic-61", "type": "slides", "title": "Understand the cost of hidden navigation", "slides": [{"id": "topic-61-1", "title": "Recognise the discoverability tradeoff", "body": "Hiding navigation can save space while making options less likely to be noticed or used. NN/g’s study found poorer outcomes for hidden navigation, particularly on desktop."}, {"id": "topic-61-2", "title": "Expose important options when possible", "body": "A visible or partly visible menu helps people understand the offering. Limited mobile space may justify a different balance, but does not remove the discovery cost."}, {"id": "topic-61-3", "title": "Measure tasks, not menu clicks alone", "body": "A rise in opening the menu could mean engagement or extra work. Examine task success, time, discovery and perceived difficulty together."}, {"id": "topic-61-4", "title": "Worked example", "body": "Cedar’s desktop header has room for Courses, Membership and Venue hire. Replacing them all with an unlabelled hamburger reduces visible evidence that venue hire exists."}, {"id": "topic-61-5", "title": "Try it in your notes", "body": "Propose visible, hidden and combined navigation for Cedar’s phone layout. State which destinations remain exposed and which risk becoming undiscoverable."}, {"id": "topic-61-6", "title": "Review your answer", "body": "A combined version might show Courses and Bookings plus a labelled Menu control. Test whether people find the less visible venue-hire option. Do not generalise one study’s exact numerical effect to every site."}, {"id": "topic-61-7", "title": "Read the original", "body": "[Hamburger Menus and Hidden Navigation Hurt UX Metrics](https://www.nngroup.com/articles/hamburger-menus/)"}], "sourceIds": ["nng-61"], "guideOrder": 30}, {"id": "topic-62", "type": "slides", "title": "Preserve global routes across the site", "slides": [{"id": "topic-62-1", "title": "Provide persistent scope", "body": "Global navigation gives access to major categories and helps visitors understand the site after landing on an internal page."}, {"id": "topic-62-2", "title": "Avoid demoting the whole offering", "body": "A single generic dropdown on a spacious desktop layout conceals category choices and adds a step before people can assess them."}, {"id": "topic-62-3", "title": "Evaluate the entire journey", "body": "Check direct entry, movement between sections and return routes. A cleaner header can create downstream confusion if it removes useful context."}, {"id": "topic-62-4", "title": "Worked example", "body": "A visitor arrives at Cedar’s pottery page from a search engine. Courses, Membership and Visit us in the header communicate the broader service. A lone “Browse” button provides less context."}, {"id": "topic-62-5", "title": "Try it in your notes", "body": "Open three deep pages on your practice site without visiting the homepage. What can you infer about the organisation and other available services?"}, {"id": "topic-62-6", "title": "Review your answer", "body": "Record missing scope cues and routes to related tasks. Check whether a consistent global menu would help before adding more promotional content. The goal is useful access and orientation, not identical headers at any cost."}, {"id": "topic-62-7", "title": "Read the original", "body": "[Killing Off the Global Navigation: One Trend to Avoid | Nielsen Norman Group](https://www.nngroup.com/articles/killing-global-navigation-one-trend-avoid/)"}], "sourceIds": ["nng-62"], "guideOrder": 31}, {"id": "topic-63", "type": "slides", "title": "Use audience categories only when they help", "slides": [{"id": "topic-63-1", "title": "Recognise audience-based navigation", "body": "Audience categories organise information around groups such as Students, Tutors or Employers. They can be useful when people identify clearly with a group and its content is distinct."}, {"id": "topic-63-2", "title": "Check overlapping roles", "body": "People can belong to several groups or be unsure which applies. Shared tasks may become duplicated or difficult to locate when audience divisions dominate."}, {"id": "topic-63-3", "title": "Compare task and topic routes", "body": "Use audience routes alongside other structures when evidence supports them. Test people with overlapping identities and visitors who do not know your organisation’s categories."}, {"id": "topic-63-4", "title": "Worked example", "body": "A Cedar tutor who also takes evening classes may not know whether refunds belong under Tutors or Learners. A clear Bookings route can serve the task regardless of role."}, {"id": "topic-63-5", "title": "Try it in your notes", "body": "Design two candidate routes to a bursary guide: one audience-based and one task/topic-based. Include a person who belongs to more than one audience in your test plan."}, {"id": "topic-63-6", "title": "Review your answer", "body": "“Young learners” may help if eligibility and content differ clearly. “Fees and funding” can support a broader task. Avoid maintaining contradictory versions of the same policy under separate audience sections."}, {"id": "topic-63-7", "title": "Read the original", "body": "[Audience-Based Website Navigation (Video)](https://www.nngroup.com/videos/audience-based-website-navigation/)"}], "sourceIds": ["nng-63"], "guideOrder": 32}, {"id": "global-check", "type": "quiz", "title": "Check: Global navigation", "skill": "Check: Global navigation", "questions": [{"id": "global-check-q1", "prompt": "A desktop menu hides everything despite ample space. The main risk is:", "options": ["Reduced visibility of the site’s offering", "Guaranteed slower server responses", "Automatically duplicated database records"], "answer": 0, "explanation": "Exposed choices help discovery and communicate scope."}, {"id": "global-check-q2", "prompt": "A user is both a tutor and learner. Audience navigation should:", "options": ["Force one permanent identity", "Duplicate all policies under both audiences", "Be tested for overlap and supported by useful task routes"], "answer": 2, "explanation": "People can occupy several roles; structure must account for shared needs."}, {"id": "global-check-q3", "prompt": "A menu opens only when the pointer hovers. What is required?", "options": ["Faster animation only", "Usable alternatives for keyboard and touch", "A warning telling keyboard users to buy a mouse"], "answer": 1, "explanation": "Essential destinations must not depend solely on hover."}, {"id": "global-check-q4", "prompt": "After a menu change, more people open it. Can you conclude success?", "options": ["No; inspect tasks, effort and outcomes", "Yes; menu clicks are the goal for every site", "Yes, if the menu uses fewer words"], "answer": 0, "explanation": "A click increase can reflect useful activity or additional work."}]}]}, {"id": "wayfinding", "type": "section", "title": "7 Orientation and wayfinding", "children": [{"id": "topic-64", "type": "slides", "title": "Show people where they are", "slides": [{"id": "topic-64-1", "title": "Support direct entry", "body": "Any page can be a visitor’s first encounter. A clear heading, site identity and structural context help people decide whether they reached the right place."}, {"id": "topic-64-2", "title": "Use complementary location cues", "body": "Current-section styling, breadcrumbs and local navigation can communicate different levels of location. Make the indication clear without relying only on colour."}, {"id": "topic-64-3", "title": "Test orientation explicitly", "body": "Ask visitors where they are, what the page belongs to and where they would go next. A working link alone does not establish orientation."}, {"id": "topic-64-4", "title": "Worked example", "body": "The page heading says “Before your first lesson”, while the sidebar identifies Pottery for beginners and the global menu marks Courses. Together the cues place a generic instruction page within a meaningful context."}, {"id": "topic-64-5", "title": "Try it in your notes", "body": "Choose a deep Cedar page. List its page-level, section-level and site-level cues. Remove one mentally: what ambiguity appears?"}, {"id": "topic-64-6", "title": "Review your answer", "body": "Without the course context, a learner might assume instructions apply to all classes. Keep the cues that distinguish scope. Evaluate whether visitors can explain the location without being coached."}, {"id": "topic-64-7", "title": "Read the original", "body": "[Navigation: You Are Here](https://www.nngroup.com/articles/navigation-you-are-here/)"}], "sourceIds": ["nng-64"], "guideOrder": 33}, {"id": "topic-65", "type": "slides", "title": "Apply digital wayfinding", "slides": [{"id": "topic-65-1", "title": "Create a readable environment", "body": "Wayfinding helps people understand their current location and possible routes. Digital equivalents of districts, paths and landmarks can make an information space easier to recognise."}, {"id": "topic-65-2", "title": "Keep landmarks consistent", "body": "Stable section names, page identities and navigation placement help people recognise places they have visited. Arbitrary changes can break that continuity."}, {"id": "topic-65-3", "title": "Provide recovery routes", "body": "Visitors should be able to move up, change direction or return to a useful starting point. An unfamiliar deep page should not become a dead end."}, {"id": "topic-65-4", "title": "Worked example", "body": "Cedar uses a consistent course title as a landmark across overview, timetable and preparation pages. Local navigation connects the pages. A Courses link offers a route back to the wider collection."}, {"id": "topic-65-5", "title": "Try it in your notes", "body": "For your practice site, identify a district, a landmark and a recovery route. Explain how each differs from decoration."}, {"id": "topic-65-6", "title": "Review your answer", "body": "A named course section is a district; its persistent title can be a landmark; a parent category link supports recovery. Their value depends on helping people understand and move, not on mimicking a physical map literally."}, {"id": "topic-65-7", "title": "Read the original", "body": "[Digital Wayfinding (Video)](https://www.nngroup.com/videos/digital-wayfinding/)"}], "sourceIds": ["nng-65"], "guideOrder": 34}, {"id": "topic-66", "type": "slides", "title": "Design useful breadcrumbs", "slides": [{"id": "topic-66-1", "title": "Represent location, not history", "body": "Breadcrumbs show a meaningful path within the hierarchy. They supplement global and local navigation. On polyhierarchical sites, choose one coherent path rather than showing every possible parent."}, {"id": "topic-66-2", "title": "Link actual destinations", "body": "Start with Home where appropriate, include real parent pages and end with the current page as nonlinked text. Avoid phantom categories that have no destination."}, {"id": "topic-66-3", "title": "Adapt to small screens", "body": "Do not shrink targets into unreadable text or wrap a long trail awkwardly. Consider showing fewer nearby levels. Breadcrumbs add little to a very shallow or purely linear site."}, {"id": "topic-66-4", "title": "Worked example", "body": "For Cedar’s pottery preparation page, a useful ordered trail is Home, Courses, Pottery for beginners, Before your first lesson. It describes structure even when someone arrives directly from a search engine."}, {"id": "topic-66-5", "title": "Try it in your notes", "body": "Write breadcrumbs for a page with two possible parents. Choose a policy and explain the phone version. Check that every linked parent is a real page."}, {"id": "topic-66-6", "title": "Review your answer", "body": "A canonical course path is one defensible choice. A shorter phone trail might expose the immediate parent with a clear label. Verify context, target usability and consistency rather than blindly retaining every level."}, {"id": "topic-66-7", "title": "Read the original", "body": "[Breadcrumbs: 11 Design Guidelines for Desktop and Mobile](https://www.nngroup.com/articles/breadcrumbs/)"}], "sourceIds": ["nng-66"], "guideOrder": 35}, {"id": "topic-67", "type": "slides", "title": "Use local navigation for nearby content", "slides": [{"id": "topic-67-1", "title": "Show the neighbourhood", "body": "Local navigation exposes pages within the current section. It supports orientation and comparison without forcing repeated trips back to a parent page."}, {"id": "topic-67-2", "title": "Distinguish global and local choices", "body": "Global navigation moves between major sections. Local navigation provides relevant detail within one. Give the local group a meaningful heading and identify the current page."}, {"id": "topic-67-3", "title": "Keep it manageable", "body": "Expose useful siblings and parents without dumping the entire site tree into a sidebar. Adapt presentation for narrow screens while preserving access."}, {"id": "topic-67-4", "title": "Worked example", "body": "A Cedar course sidebar offers Overview, Dates and fees, Before you arrive and Accessibility. Learners can compare preparation and access information without repeatedly returning to the course overview."}, {"id": "topic-67-5", "title": "Try it in your notes", "body": "Choose five useful local destinations for venue hire. Which belong in global navigation or in the page body instead?"}, {"id": "topic-67-6", "title": "Review your answer", "body": "Room options, Prices, Availability and booking, Equipment and Access could form local navigation. Membership is a global alternative; a specific cancellation deadline belongs in policy content, possibly linked contextually."}, {"id": "topic-67-7", "title": "Read the original", "body": "[Local Navigation Is a Valuable Orientation and Wayfinding Aid](https://www.nngroup.com/articles/local-navigation/)"}], "sourceIds": ["nng-67"], "guideOrder": 36}, {"id": "wayfinding-check", "type": "quiz", "title": "Check: Orientation and wayfinding", "
