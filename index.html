skill": "Check: Orientation and wayfinding", "questions": [{"id": "wayfinding-check-q1", "prompt": "Someone arrives on a deep page from search. What helps?", "options": ["Assuming they saw the homepage", "Removing all links to other sections", "Clear page identity and section context"], "answer": 2, "explanation": "Direct-entry visitors still need orientation."}, {"id": "wayfinding-check-q2", "prompt": "What should ordinary location breadcrumbs describe?", "options": ["Every possible parent at once", "A coherent path in the site hierarchy", "Every page clicked in this browser session"], "answer": 1, "explanation": "Hierarchy and browsing history are different."}, {"id": "wayfinding-check-q3", "prompt": "A breadcrumb parent has no actual page. What should you do?", "options": ["Reconsider the trail or provide a meaningful destination", "Link it to an unrelated page", "Keep a broken link to maintain symmetry"], "answer": 0, "explanation": "Breadcrumb links should represent useful real destinations."}, {"id": "wayfinding-check-q4", "prompt": "Visitors repeatedly go up to compare sibling pages. Consider:", "options": ["Removing section labels", "Hiding the parent link", "Useful local navigation"], "answer": 2, "explanation": "Local routes can reduce unnecessary trips through the parent page."}]}]}, {"id": "patterns", "type": "section", "title": "8 Navigation patterns", "children": [{"id": "topic-68", "type": "slides", "title": "Keep sticky headers useful and unobtrusive", "slides": [{"id": "topic-68-1", "title": "Decide whether persistence helps", "body": "A sticky header keeps controls available during scrolling. Use it when repeated access benefits the task; it also consumes space and can obstruct content."}, {"id": "topic-68-2", "title": "Control size and contrast", "body": "Keep persistent chrome compact and distinguish it from the content beneath. Check that headings, focused controls and anchor destinations remain visible."}, {"id": "topic-68-3", "title": "Avoid distracting movement", "body": "Use minimal, predictable motion. A partially persistent header may be appropriate, but appearing and disappearing controls should not interfere with reading or interaction."}, {"id": "topic-68-4", "title": "Worked example", "body": "Cedar’s phone header occupies almost half the screen after the menu and voice bar open. A compact header with the active voice controls in normal flow leaves more room for the lesson or booking content."}, {"id": "topic-68-5", "title": "Try it in your notes", "body": "Inspect a long page while scrolling and enlarging text. Note any content hidden by the header, keyboard focus obscured or jump-link destinations covered."}, {"id": "topic-68-6", "title": "Review your answer", "body": "Reduce unnecessary height, provide suitable scroll spacing and reconsider persistence if it does not support the task. Test the combined state with banners, navigation and optional voice controls visible."}, {"id": "topic-68-7", "title": "Read the original", "body": "[Sticky Headers: 5 Ways to Make Them Better](https://www.nngroup.com/articles/sticky-headers/)"}], "sourceIds": ["nng-68"], "guideOrder": 37}, {"id": "topic-69", "type": "slides", "title": "Choose vertical navigation for a broad structure", "slides": [{"id": "topic-69-1", "title": "Recognise its strengths", "body": "A left-side vertical menu can accommodate more categories and longer labels than a constrained horizontal bar. It is familiar and supports scanning and growth."}, {"id": "topic-69-2", "title": "Accept its space cost", "body": "The sidebar consumes width. Evaluate the content area and responsive behaviour rather than squeezing the same structure into every screen."}, {"id": "topic-69-3", "title": "Make the list scannable", "body": "Left-align labels, put distinguishing words early and keep the menu visible. Separate levels clearly and avoid reducing readability to make everything fit."}, {"id": "topic-69-4", "title": "Worked example", "body": "Cedar’s staff learning portal has twelve subject areas with descriptive names. A left sidebar accommodates them without tiny text. On a phone, a labelled course-outline control exposes the same subjects."}, {"id": "topic-69-5", "title": "Try it in your notes", "body": "Compare a horizontal bar and vertical list using the same twelve labels. Identify where truncation or compression would change meaning."}, {"id": "topic-69-6", "title": "Review your answer", "body": "If “Support for course tutors” becomes “Support”, the saved space sacrifices useful distinction. Consider a vertical pattern or different grouping before changing the label. Validate scanning and narrow-screen access."}, {"id": "topic-69-7", "title": "Read the original", "body": "[Left-Side Vertical Navigation on Desktop: Scalable, Responsive, and Easy to Scan](https://www.nngroup.com/articles/vertical-nav/)"}], "sourceIds": ["nng-69"], "guideOrder": 38}, {"id": "topic-70", "type": "slides", "title": "Plan vertical navigation states", "slides": [{"id": "topic-70-1", "title": "Separate pattern from hierarchy", "body": "A vertical list can represent global or local navigation. Its direction does not determine the information architecture or which levels should be exposed."}, {"id": "topic-70-2", "title": "Specify expansion and selection", "body": "Show which groups expand, which destinations navigate and which page is current. Avoid one ambiguous target doing different things depending on where it is clicked."}, {"id": "topic-70-3", "title": "Handle long lists deliberately", "body": "Consider scrolling, section grouping and preservation of position. Keep keyboard access and orientation intact when the selected page changes."}, {"id": "topic-70-4", "title": "Worked example", "body": "Cedar’s LMS outline has section disclosures and lesson links inside them. Opening a section exposes choices; selecting a lesson changes content. These actions should remain distinct and consistently labelled."}, {"id": "topic-70-5", "title": "Try it in your notes", "body": "Write a state specification for a course sidebar: collapsed group, expanded group, current lesson and narrow-screen drawer. State what happens to focus when it closes."}, {"id": "topic-70-6", "title": "Review your answer", "body": "A drawer should return focus to its trigger when closed. Current-page meaning should be exposed to assistive technology as well as visually. Do not claim a sidebar is accessible without testing its actual interaction."}, {"id": "topic-70-7", "title": "Read the original", "body": "[Vertical Navigation (Video)](https://www.nngroup.com/videos/vertical-navigation/)"}], "sourceIds": ["nng-70"], "guideOrder": 39}, {"id": "topic-71", "type": "slides", "title": "Place utility navigation where it is needed", "slides": [{"id": "topic-71-1", "title": "Identify supporting tools", "body": "Utility navigation provides actions such as sign in, contact, save, print or change view. These tools support use of the site rather than define its main subject categories."}, {"id": "topic-71-2", "title": "Group and place by purpose", "body": "Use expected locations and distinguish account tools from primary categories. Put contextual tools near the content they affect when that improves understanding."}, {"id": "topic-71-3", "title": "Use clear labels and states", "body": "Recognisable icons may support tools, but require accessible names. Explain state changes and show only actions that are actually available."}, {"id": "topic-71-4", "title": "Worked example", "body": "Cedar’s public categories are Courses, Membership and Visit us. Sign in belongs with account tools. Print this timetable belongs near the timetable. A voice icon appears only after the server verifies private access."}, {"id": "topic-71-5", "title": "Try it in your notes", "body": "Classify Notes, Courses, Sign out, Contact and Print timetable. Decide where each should appear and what its label must explain."}, {"id": "topic-71-6", "title": "Review your answer", "body": "Courses is primary navigation. Sign out is an account utility. Notes and Print are contextual tools; Contact may be global utility or a primary task depending on the service. Document the reason for each placement."}, {"id": "topic-71-7", "title": "Read the original", "body": "[Utility Navigation: What It Is and How to Design It](https://www.nngroup.com/articles/utility-navigation/)"}], "sourceIds": ["nng-71"], "guideOrder": 40}, {"id": "topic-72", "type": "slides", "title": "Give the footer a deliberate job", "slides": [{"id": "topic-72-1", "title": "Support expected secondary routes", "body": "Footers often contain contact, help, legal information and other supporting destinations. Visitors may look there intentionally or after failing to find a route elsewhere."}, {"id": "topic-72-2", "title": "Choose a pattern for the content", "body": "A compact footer, grouped doormat navigation, site-map links, secondary tasks or contextual footer serve different needs. Do not add a large footer solely to imitate another site."}, {"id": "topic-72-3", "title": "Keep it reachable", "body": "Infinite scrolling can make the footer impossible to reach. Promotional modules should not obscure necessary links. Maintain the same labelling care used in the main menu."}, {"id": "topic-72-4", "title": "Worked example", "body": "Cedar’s footer groups Contact, Accessibility and Privacy, plus a clear Venue hire route. A long events feed provides a stable way to reach footer information rather than continually pushing it away."}, {"id": "topic-72-5", "title": "Try it in your notes", "body": "Design a small footer inventory. For each item, record its user need and whether another route should also exist. Remove one item with no clear purpose."}, {"id": "topic-72-6", "title": "Review your answer", "body": "Important accessibility support may need contextual links as well as a footer route. The footer is useful redundancy, not a place to hide content essential to booking. Verify that visitors can reach it by keyboard and on a phone."}, {"id": "topic-72-7", "title": "Read the original", "body": "[Web Page Footers 101: Design Patterns and When to Use Each](https://www.nngroup.com/articles/footers/)"}], "sourceIds": ["nng-72"], "guideOrder": 41}, {"id": "topic-73", "type": "slides", "title": "Use mega menus for grouped choices", "slides": [{"id": "topic-73-1", "title": "Expose useful levels together", "body": "A mega menu presents multiple grouped choices in a large panel. It can reveal categories and subcategories at a glance without forcing deep cascading menus."}, {"id": "topic-73-2", "title": "Organise the panel", "body": "Use meaningful group headings, clear typography and orderly placement. Keep the choices understandable without promotional images or colour alone."}, {"id": "topic-73-3", "title": "Specify reliable interaction", "body": "Support click/tap and keyboard access, predictable closing and manageable focus. Pointer hover should not be the only route. Plan an alternative for smaller screens."}, {"id": "topic-73-4", "title": "Worked example", "body": "Cedar’s Courses panel groups Arts, Computing and Languages with several popular subjects beneath each. Its full directory remains reachable. An unrelated membership promotion would compete with the menu’s finding task."}, {"id": "topic-73-5", "title": "Try it in your notes", "body": "Sketch the content specification for a mega menu using three groups and nine destinations. Write the small-screen fallback and the keyboard behaviour."}, {"id": "topic-73-6", "title": "Review your answer", "body": "A nested disclosure or category landing page can expose the same destinations on a phone. Do not merely shrink the desktop panel. Ensure that group headings and actual destination links are distinguishable."}, {"id": "topic-73-7", "title": "Read the original", "body": "[Mega Menus Work Well for Site Navigation](https://www.nngroup.com/articles/mega-menus-work-well/)"}], "sourceIds": ["nng-73"], "guideOrder": 42}, {"id": "topic-74", "type": "slides", "title": "Make the route home recognisable", "slides": [{"id": "topic-74-1", "title": "Use convention deliberately", "body": "People often expect a site’s logo or identity at the upper left to return home. NN/g’s study found that centring the logo made returning home harder in its tested designs."}, {"id": "topic-74-2", "title": "Separate branding from navigation evidence", "body": "Aesthetic preference or brand recall does not establish that visitors recognise a home link. Check placement, accessible naming and additional home routes."}, {"id": "topic-74-3", "title": "Test the relevant context", "body": "Do not treat a study’s exact effect size as a universal prediction. Include direct entry and recovery tasks across the layouts your audience uses."}, {"id": "topic-74-4", "title": "Worked example", "body": "Cedar places its linked identity at the top left and supplies a clear Home destination where useful. A mobile layout preserves an understandable route instead of assuming a decorative centred mark will be recognised."}, {"id": "topic-74-5", "title": "Try it in your notes", "body": "Open a deep page and ask someone to return to the site’s starting point. Record the first action, hesitation and whether the route was understood."}, {"id": "topic-74-6", "title": "Review your answer", "body": "If the identity is mistaken for decoration, inspect its placement and accessible name. An explicit Home link can provide another route. Avoid making users depend on a convention they cannot perceive."}, {"id": "topic-74-7", "title": "Read the original", "body": "[Centered Logos Hurt Website Navigation](https://www.nngroup.com/articles/centered-logos/)"}], "sourceIds": ["nng-74"], "guideOrder": 43}, {"id": "patterns-check", "type": "quiz", "title": "Check: Navigation patterns", "skill": "Check: Navigation patterns", "questions": [{"id": "patterns-check-q1", "prompt": "A sticky header obscures focused controls. What should change?", "options": ["The number of taxonomy terms", "Its layout or persistence so content and focus remain usable", "Only the menu’s alphabetical order"], "answer": 1, "explanation": "Persistent chrome must not obstruct essential content."}, {"id": "patterns-check-q2", "prompt": "Long labels become ambiguous when squeezed into a top bar. Consider:", "options": ["A suitable vertical pattern or revised grouping", "Smaller and smaller text", "Replacing all labels with decorative icons"], "answer": 0, "explanation": "Choose a pattern that accommodates useful meaning."}, {"id": "patterns-check-q3", "prompt": "Which is usually a utility rather than a subject category?", "options": ["Computing courses", "Swimming", "Sign out"], "answer": 2, "explanation": "Utilities support interaction and account tasks."}, {"id": "patterns-check-q4", "prompt": "A mega menu works on hover only. Is the job complete?", "options": ["Yes; a large panel makes it accessible automatically", "No; specify keyboard, touch and responsive behaviour", "Yes; the groupings are visible in a screenshot"], "answer": 1, "explanation": "The pattern must be operable, not just visually plausible."}]}]}, {"id": "mobile", "type": "section", "title": "9 Mobile navigation", "children": [{"id": "topic-75", "type": "slides", "title": "Select a mobile navigation pattern", "slides": [{"id": "topic-75-1", "title": "Balance visibility and space", "body": "Mobile navigation needs to remain discoverable and operable without consuming the content area. The best balance depends on the offering and frequent tasks."}, {"id": "topic-75-2", "title": "Compare the main approaches", "body": "Visible navigation or tab bars expose a limited set of destinations. A menu drawer can hold more but hides choices. A navigation hub uses a page to present routes with more context."}, {"id": "topic-75-3", "title": "Keep essentials recognisable", "body": "Prioritise meaningful destinations, clear labels and usable targets. Preserve access to less frequent tasks and test whether hidden options are found."}, {"id": "topic-75-4", "title": "Worked example", "body": "A compact Cedar booking app might expose Courses, My bookings and Account. A broad public site may need a labelled menu and useful category pages rather than trying to fit every category in a bottom bar."}, {"id": "topic-75-5", "title": "Try it in your notes", "body": "Choose a pattern for Cedar’s public site and its returning-member booking tool. State the top tasks and the cost of your choice."}, {"id": "topic-75-6", "title": "Review your answer", "body": "Different products can justify different patterns. A bar with three frequent destinations can support returning members, while a public site needs to reveal a broader offering. Evaluate the hidden routes rather than treating them as solved."}, {"id": "topic-75-7", "title": "Read the original", "body": "[Basic Patterns for Mobile Navigation](https://www.nngroup.com/articles/mobile-navigation-patterns/)"}], "sourceIds": ["nng-75"], "guideOrder": 44}, {"id": "topic-76", "type": "slides", "title": "Preserve context in mobile subnavigation", "slides": [{"id": "topic-76-1", "title": "Handle more than one level", "body": "Mobile subnavigation reveals choices within a section. Common patterns include accordions, sequential menus, section menus and subnavigation hubs. Each trades visible context against space and interaction effort."}, {"id": "topic-76-2", "title": "Make movement clear", "body": "People should distinguish opening a group, visiting a category page and moving back a level. Provide current section context so a new panel does not feel like an unrelated page."}, {"id": "topic-76-3", "title": "Avoid ambiguous split actions", "body": "A parent label that navigates while a tiny adjacent icon expands can be confusing. Use a clear, testable interaction and ensure parent overview content remains reachable."}, {"id": "topic-76-4", "title": "Worked example", "body": "Cedar’s phone menu opens Courses, then Computing. The panel heading identifies Computing and a labelled Back to Courses control reverses the level. “Computing overview” remains a real destination."}, {"id": "topic-76-5", "title": "Try it in your notes", "body": "Specify how someone reaches a third-level course and then moves to a sibling subject. Include expansion, page navigation and back behaviour."}, {"id": "topic-76-6", "title": "Review your answer", "body": "A sequential menu can retain a visible title and parent route. An accordion can retain surrounding categories but grow long. Test whether visitors understand both location and next action, including with keyboard and screen reader."}, {"id": "topic-76-7", "title": "Read the original", "body": "[Mobile Subnavigation](https://www.nngroup.com/articles/mobile-subnavigation/)"}], "sourceIds": ["nng-76"], "guideOrder": 45}, {"id": "topic-77", "type": "slides", "title": "Distinguish expansion from navigation", "slides": [{"id": "topic-77-1", "title": "Use a clear signifier", "body": "NN/g’s accordion-icon research found the caret more clearly communicated expansion in place than the alternatives it tested. A signifier is a cue to an action, not the action itself."}, {"id": "topic-77-2", "title": "Align cue and behaviour", "body": "An expanding control should expose its state and operate consistently across its label and icon. Do not present a familiar expansion cue that unexpectedly navigates elsewhere."}, {"id": "topic-77-3", "title": "Test more than recognition", "body": "Comprehensible icons do not establish keyboard operation, focus handling or content discoverability. Keep meaningful text and test the whole control."}, {"id": "topic-77-4", "title": "Worked example", "body": "In Cedar’s outline, “Research methods” and its SVG caret form one disclosure target. Selecting it reveals lessons. The separate “Card sorting” link opens a lesson. A screen reader can identify the disclosure’s state."}, {"id": "topic-77-5", "title": "Try it in your notes", "body": "Write a control specification with its accessible name, action, expanded state and keyboard operation. How will a user know whether selecting it changes the page?"}, {"id": "topic-77-6", "title": "Review your answer", "body": "A button can expand a group and expose aria-expanded; a link can navigate to a destination. Native details/summary may suit a simple disclosure. Choose semantics based on behaviour and verify the actual implementation."}, {"id": "topic-77-7", "title": "Read the original", "body": "[Accordion Icons: Which Signifiers Work Best?](https://www.nngroup.com/articles/accordion-icons/)"}], "sourceIds": ["nng-77"], "guideOrder": 46}, {"id": "mobile-check", "type": "quiz", "title": "Check: Mobile navigation", "skill": "Check: Mobile navigation", "questions": [{"id": "mobile-check-q1", "prompt": "A parent label navigates while a tiny adjacent icon expands. Investigate:", "options": ["Whether users understand and can operate both actions", "Only whether the icon is colourful", "Whether all headings rhyme"], "answer": 0, "explanation": "Split actions can create ambiguity and small targets."}, {"id": "mobile-check-q2", "prompt": "A phone menu panel replaces the previous level. Include:", "options": ["Only an unlabelled close icon", "No way to change direction", "A clear current-section title and parent route"], "answer": 2, "explanation": "Sequential navigation needs orientation and recovery."}, {"id": "mobile-check-q3", "prompt": "A caret correctly suggests expansion. What still needs testing?", "options": ["Nothing; recognition proves full accessibility", "Actual state announcements and operation", "Only the brand font"], "answer": 1, "explanation": "A useful signifier does not establish complete interaction quality."}, {"id": "mobile-check-q4", "prompt": "Which phone pattern is always best?", "options": ["None; compare the task and tradeoffs", "An unlabelled hamburger for all sites", "A five-item bottom bar for every content space"], "answer": 0, "explanation": "Visibility, capacity and space requirements vary."}]}]}, {"id": "apply", "type": "section", "title": "10 Apply and maintain", "children": [{"id": "inventory", "type": "slides", "title": "Build an inventory and audit", "slides": [{"id": "inventory-1", "title": "Create the evidence base", "body": "This authored workshop starts before rearranging menus. An inventory records the content space; an audit evaluates whether each item is useful, accurate and maintainable. Include functions, documents and externally hosted steps as well as ordinary pages."}, {"id": "inventory-2", "title": "Record comparable fields", "body": "| Field | Example |\n| --- | --- |\n| Stable ID | C3 |\n| URL and title | /members/cancel; Cancel a booking |\n| Type and task | Policy; understand refund eligibility |\n| Owner and status | Booking team; review required |\n| Relationships | Booking record, payment help |"}, {"id": "inventory-3", "title": "Evaluate quality separately", "body": "Check evidence of a user need, accuracy, accessibility, duplication, relevance and ownership. An analytics count is a clue about use, not proof of usefulness. Low traffic may mean low demand or poor findability."}, {"id": "inventory-4", "title": "Worked decision", "body": "Cedar has two fee tables with different prices. The audit records a factual conflict and asks the course owner to verify the source of truth. The IA proposal uses one maintained fee record linked from relevant courses."}, {"id": "inventory-5", "title": "Practise", "body": "Inventory ten pages or functions. Mark each Keep, Improve, Merge, Retire or Investigate, with a reason and owner. Do not remove a page solely because it is old or rarely visited."}, {"id": "inventory-6", "title": "Review your work", "body": "Every proposed change should connect to evidence or a clearly marked hypothesis. Resolve important factual conflicts before asking participants to use misleading content. Keep an explicit list of missing information and externally owned dependencies."}], "sourceIds": []}, {"id": "schemes", "type": "slides", "title": "Choose an organising scheme", "slides": [{"id": "schemes-1", "title": "Compare organising principles", "body": "This workshop compares topic, task, audience, chronology and alphabetical schemes. A site can use several at different levels. Decide which expectation each scheme supports instead of mixing incompatible categories without explanation."}, {"id": "schemes-2", "title": "Make the distinctions concrete", "body": "| Scheme | Cedar example | Useful when |\n| --- | --- | --- |\n| Topic | Computing courses | People know the subject |\n| Task | Cancel a booking | An action is the goal |\n| Audience | Course tutors | Needs are role-specific |\n| Time | Events this week | Timing drives selection |\n| Alphabetical | Tutor directory | People know a name |"}, {"id": "schemes-3", "title": "Avoid unexplained mixtures", "body": "“Courses / Families / Tuesday / Help” combines topic, audience, time and support. That may create overlap. Use secondary routes or filters where they support different ways of seeking the same records."}, {"id": "schemes-4", "title": "Worked proposal", "body": "Cedar’s primary course organisation uses subject. Filters expose schedule, level and delivery. A Family activities landing page provides a curated alternate route to relevant courses without duplicating their maintained records."}, {"id": "schemes-5", "title": "Practise", "body": "Choose a primary scheme for fifteen inventory items. Add one justified secondary route. Write inclusion and exclusion rules for each top-level group."}, {"id": "schemes-6", "title": "Review your work", "body": "Can you explain where a new item belongs? Are sibling labels distinct enough to compare? Use outliers to challenge the scheme and make a research plan for ambiguous boundaries."}], "sourceIds": []}, {"id": "map-model", "type": "slides", "title": "Specify a sitemap and content model", "slides": [{"id": "map-model-1", "title": "Document relationships", "body": "This authored workshop turns your proposal into a usable specification. A sitemap records hierarchy and important cross-links. A content model records types, fields and relationships. A task flow records steps over time; it answers a different question."}, {"id": "map-model-2", "title": "Use a relationship table", "body": "| Item | Type | Parent | Additional route |\n| --- | --- | --- | --- |\n| Courses | Category page | Home | Main navigation |\n| Pottery | Course record | Arts courses | Family activities if eligible |\n| Prepare for pottery | Guidance | Pottery | Booking confirmation |\n| Refund policy | Policy | Booking help | Relevant course pages |"}, {"id": "map-model-3", "title": "Model the record", "body": "A Course could have ID, title, summary, subject, level, dates, fee relationship, venue relationship and access information. Reusing a venue record can prevent many classes from containing outdated copies of the same directions."}, {"id": "map-model-4", "title": "Distinguish types of relationship", "body": "“Belongs under”, “takes place at”, “requires” and “is related to” are different relationships. A sitemap alone may not capture all of them. Name the relationship before choosing how to expose it."}, {"id": "map-model-5", "title": "Practise", "body": "Produce a sitemap table for fifteen items and a field specification for one type. Define required fields, allowed values and who owns updates."}, {"id": "map-model-6", "title": "Review your work", "body": "Check unique IDs, orphan items, circular parent relationships, duplicate records and missing parent destinations. Test whether someone else can add a new course without asking you to explain the model."}], "sourceIds": []}, {"id": "search-workshop", "type": "slides", "title": "Design a searchable information space", "slides": [{"id": "search-workshop-1", "title": "Connect classification to retrieval", "body": "This applied workshop considers what a search experience needs: meaningful content, useful metadata, sensible result presentation and recovery. It is a design specification, not a promise that a particular search engine implements these capabilities."}, {"id": "search-workshop-2", "title": "Define search behaviour", "body": "Record likely queries, synonyms, spelling variants and important vocabulary differences. Decide which content types are searchable and how restricted or retired items are excluded. Keep query logs free of unnecessary personal information."}, {"id": "search-workshop-3", "title": "Use filters and facets deliberately", "body": "A facet describes a dimension such as subject, level or delivery. A filter narrows the current results. Specify whether selections combine with AND or OR, show active selections and provide a clear reset."}, {"id": "search-workshop-4", "title": "Worked filter logic", "body": "A learner selects Arts OR Computing within Subject, then Beginner within Level. If dimensions combine with AND, results must be Beginner and in either selected subject. State this explicitly rather than assuming the interface makes it obvious."}, {"id": "search-workshop-5", "title": "Design results and recovery", "body": "Show a descriptive title, useful summary and distinguishing context such as date, type or venue. Preserve the query when nothing matches; allow revision and clearing filters. Do not invent helpful alternatives the system cannot actually produce."}, {"id": "search-workshop-6", "title": "Practise", "body": "Specify results for “evening coding”, a synonym query and an empty result after filtering. Include one ambiguous result and explain which metadata would distinguish it."}, {"id": "search-workshop-7", "title": "Review your work", "body": "Check whether each result helps a learner predict relevance. Verify filter counts and combinations against real data. Test known-item searching and exploratory browsing separately; ranking quality cannot be established by a static mockup."}], "sourceIds": []}, {"id": "research-plan", "type": "slides", "title": "Combine qualitative and quantitative evidence", "slides": [{"id": "research-plan-1", "title": "Choose the uncertainty", "body": "This workshop connects to the supplementary research guides. Qualitative work explores behaviour and reasoning; quantitative work estimates or compares measures. Neither substitutes automatically for the other."}, {"id": "research-plan-2", "title": "Recruit and protect participants", "body": "Define who belongs in the study and relevant variation. Explain consent, recording, retention and withdrawal. Avoid collecting personal information unnecessary for the research question. Keep participant details out of public project documents."}, {"id": "research-plan-3", "title": "Write a testable question", "body": "“Is our IA good?” is too broad. “Can newcomers locate cancellation conditions without selecting Membership first?” identifies an audience, destination and potential problem. Decide which observation or measure would inform a change."}, {"id": "research-plan-4", "title": "Worked mixed plan", "body": "First observe several Cedar newcomers using the current structure to understand confusion. Revise the labels, pilot a tree test, then collect a suitable larger sample if you need a comparative estimate. Check the actual interface afterwards."}, {"id": "research-plan-5", "title": "Report uncertainty honestly", "body": "Record method, participants, tasks, versions and exclusions. Separate observation, interpretation and recommendation. Report a small study as exploratory; a percentage without sample size and context can imply false precision."}, {"id": "research-plan-6", "title": "Practise", "body": "Write one qualitative question and one quantitative question for the same task. Specify the method, success rule and limitation for each."}, {"id": "research-plan-7", "title": "Review your work", "body": "“What makes this label confusing?” needs reasoning evidence. “What proportion finds the destination?” needs a sampling and measurement plan. Do not use a few comments to claim prevalence or a success rate to claim you know the cause."}], "sourceIds": ["nng-47", "nng-48"]}, {"id": "accessibility-workshop", "type": "slides", "title": "Check navigation across access needs", "slides": [{"id": "accessibility-workshop-1", "title": "Make access part of the design", "body": "This authored workshop applies the earlier navigation principles. A clear hierarchy still needs an operable interface. Plan meaningful landmarks, logical headings, descriptive links and readable content in the real layout."}, {"id": "accessibility-workshop-2", "title": "Specify control semantics", "body": "Use links for destinations and buttons for actions. Expose the current page and disclosure state appropriately. Ensure keyboard users can enter, operate and leave menus without a trap."}, {"id": "accessibility-workshop-3", "title": "Check focus and presentation", "body": "Keep focus visible and logical. Check that overlays close predictably and return focus to a sensible place. Enlarged text, narrow screens and persistent headers must not conceal required controls or content."}, {"id": "accessibility-workshop-4", "title": "Preserve multiple cues", "body": "Do not rely on colour, position, sound or an icon alone. Give icon controls meaningful accessible names and provide text for essential audio information. Use language versions based on audience needs and maintain terminology consistently."}, {"id": "accessibility-workshop-5", "title": "Practise", "body": "Using only the keyboard, open a section, visit a deep destination and return. Repeat at enlarged text and a narrow viewport. If possible, inspect announcements with a screen reader."}, {"id": "accessibility-workshop-6", "title": "Review your work", "body": "Record the exact action and observed failure, not “accessibility is bad”. Automated checks can help identify issues but do not establish full accessibility or legal conformance. Include people with relevant access needs in research."}], "sourceIds": []}, {"id": "migration", "type": "slides", "title": "Plan a safe information migration", "slides": [{"id": "migration-1", "title": "Map old items to new destinations", "body": "This authored workshop covers change implementation. Keep a mapping from old identifiers and URLs to retained, merged, replacement or intentionally retired items. A redesign can break established routes even when the new structure is clearer."}, {"id": "migration-2", "title": "Handle redirects and references", "body": "For moved content, plan appropriate redirects and update internal links. Avoid redirecting unrelated old pages to Home merely to conceal missing content. Review documents, bookmarks, external services and search indexing."}, {"id": "migration-3", "title": "Define a cross-listing policy", "body": "Choose canonical records and document alternate routes. Check breadcrumb consistency, feeds and related-content queries. One visible page can depend on several backend relationships."}, {"id": "migration-4", "title": "Worked migration row", "body": "Old: /member-zone/refunds. New: /booking-help/cancellation-refunds. Decision: move verified policy, redirect the old URL, update booking confirmations, preserve the owner and test both entry routes."}, {"id": "migration-5", "title": "Practise", "body": "Map five old URLs, including a merger and a retirement. Define acceptance checks and a rollback plan for a high-risk move."}, {"id": "migration-6", "title": "Review your work", "body": "Verify destination relevance, redirect loops, access permissions, saved links and content accuracy. Test important routes before and after release. Record what to restore if the release creates a critical finding failure."}], "sourceIds": []}, {"id": "governance", "type": "slides", "title": "Maintain the architecture after launch", "slides": [{"id": "governance-1", "title": "Assign decisions to owners", "body": "This authored workshop treats IA as a maintained system. Decide who may add categories, rename terms, create content types and approve cross-listing. Keep a lightweight decision record."}, {"id": "governance-2", "title": "Define review triggers", "body": "Review after new services, repeated support questions, failed searches, changed user language or observed task failures. A calendar review helps but does not replace responding to meaningful changes."}, {"id": "governance-3", "title": "Monitor outcomes", "body": "Track task success research, search failures, broken routes and support themes. Traffic and clicks need interpretation. An unused page could be unnecessary, hard to find or useful only at a rare but important moment."}, {"id": "governance-4", "title": "Worked decision record", "body": "Proposal: rename Enrichment to Courses. Evidence: newcomers cannot predict the contents. Owner: learning editor. Validation: tree test and observed finding task. Follow-up: review failed searches after release. Record the version and remaining uncertainty."}, {"id": "governance-5", "title": "Practise", "body": "Create a category-change request with its rationale, affected content, owner, research, migration actions and review trigger."}, {"id": "governance-6", "title": "Review your work", "body": "Could another editor apply the rule consistently? Does the proposal protect existing routes and content accuracy? Keep a method for retiring obsolete terms and mapping useful synonyms without silently losing content."}], "sourceIds": []}, {"id": "capstone", "type": "slides", "title": "Build and evaluate your own IA", "slides": [{"id": "capstone-1", "title": "Stage 1: define the brief", "body": "Choose a manageable information space. Name the audience, three important tasks, constraints and unknowns. Produce an inventory and audit. Keep a baseline structure and distinguish facts from assumptions."}, {"id": "capstone-2", "title": "Stage 2: propose the architecture", "body": "Choose an organising scheme. Create a sitemap, content model and small controlled vocabulary. Write category labels, explain boundaries and justify any cross-listing. Record why competing options were rejected."}, {"id": "capstone-3", "title": "Stage 3: research the structure", "body": "Prepare an appropriate card sort or use existing evidence. Create unbiased tree-test tasks and define acceptable destinations. Pilot, gather evidence and revise. Report sample limitations; invented practice data must remain labelled fictional."}, {"id": "capstone-4", "title": "Stage 4: specify navigation", "body": "Choose global, local, utility and contextual routes. Plan direct-entry orientation, breadcrumbs and mobile subnavigation. Specify expanded, current, loading and failure states. Include keyboard and focus behaviour."}, {"id": "capstone-5", "title": "Stage 5: test and maintain", "body": "Observe important tasks in a realistic prototype. Compare the result with your baseline using equivalent criteria. Produce migration, ownership and monitoring plans. Identify what remains untested."}, {"id": "capstone-6", "title": "Self-assessment rubric", "body": "| Evidence | Check |\n| --- | --- |\n| Structure | New content has a clear home |\n| Labels | Readers predict destinations |\n| Research | Method answers the stated question |\n| Navigation | Tasks work across tested input modes |\n| Maintenance | Owners and change rules are defined |"}, {"id": "capstone-7", "title": "Review and iterate", "body": "Ask someone to challenge one category boundary and complete one task without coaching. Revise using what you observe. Your final submission is a reasoned proposal plus evidence and limitations, not simply a polished sitemap."}], "sourceIds": []}, {"id": "apply-check", "type": "quiz", "title": "Check: Apply and maintain", "skill": "Check: Apply and maintain", "questions": [{"id": "apply-check-q1", "prompt": "Two fee pages conflict. Your first response should be:", "options": ["Rename both without checking prices", "Verify the authoritative facts and plan consolidation", "Choose the page with more traffic as automatically correct"], "answer": 1, "explanation": "Organisation cannot resolve factual accuracy by itself."}, {"id": "apply-check-q2", "prompt": "Why record AND/OR rules for filters?", "options": ["They determine which results remain after selection", "They determine the page’s background colour", "They eliminate all empty results"], "answer": 0, "explanation": "Within and across facets, combination rules change retrieval behaviour."}, {"id": "apply-check-q3", "prompt": "Five interviews produce a common complaint. Report it as:", "options": ["A precise population prevalence estimate", "Proof that every user has the issue", "An exploratory finding with sample and context"], "answer": 2, "explanation": "Qualitative patterns can motivate changes without establishing prevalence."}, {"id": "apply-check-q4", "prompt": "A moved refund page had established incoming links. Plan:", "options": ["Deleting all old URLs without checking use", "Relevant redirects, updated references and route checks", "Redirecting every old page to Home regardless of subject"], "answer": 1, "explanation": "Migration should preserve meaningful established access."}]}]}, {"id": "references", "type": "section", "title": "11 Reference", "children": [{"id": "glossary", "type": "slides", "title": "Terminology lookup", "slides": [{"id": "glossary-1", "title": "IA", "body": "The relationships, organisation and naming of an information space."}, {"id": "glossary-2", "title": "Navigation", "body": "The interface routes used to reach content and functions."}, {"id": "glossary-3", "title": "Mental model", "body": "A person’s understanding or expectation of how something works."}, {"id": "glossary-4", "title": "Information scent", "body": "Cues used to predict whether a route will satisfy a need."}, {"id": "glossary-5", "title": "Findability and discoverability", "body": "Finding something expected versus encountering something previously unknown."}, {"id": "glossary-6", "title": "Hierarchy and polyhierarchy", "body": "One-parent organisation versus a structure in which some items have multiple parents."}, {"id": "glossary-7", "title": "Taxonomy and metadata", "body": "A controlled hierarchical vocabulary; descriptive data attached to content."}, {"id": "glossary-8", "title": "Content model", "body": "The types, fields and relationships used to represent content."}, {"id": "glossary-9", "title": "Card sort", "body": "A study of how participants group content."}, {"id": "glossary-10", "title": "Tree test", "body": "A task-based evaluation of a stripped-down hierarchy."}, {"id": "glossary-11", "title": "Dendrogram", "body": "A visual representation of clustering under a particular analysis method."}, {"id": "glossary-12", "title": "Success and directness", "body": "Reaching an acceptable destination versus how directly a route is followed; state tool definitions and denominators."}, {"id": "glossary-13", "title": "Global and local navigation", "body": "Major site-wide routes versus routes within a section."}, {"id": "glossary-14", "title": "Utility and contextual navigation", "body": "Supporting tools versus links relevant to the current content or activity."}, {"id": "glossary-15", "title": "Breadcrumb", "body": "A compact representation of location in a hierarchy."}, {"id": "glossary-16", "title": "Facet and filter", "body": "A classification dimension; a constraint that narrows the current result set."}, {"id": "glossary-17", "title": "Canonical record", "body": "The maintained source record referenced through multiple routes."}, {"id": "glossary-18", "title": "Governance", "body": "Ownership and rules for maintaining decisions and responding to change."}], "sourceIds": []}, {"id": "source-directory", "type": "slides", "title": "Reading directory and coverage", "slides": [{"id": "source-directory-1", "title": "Reading scope", "body": "The 46 numbered resources in NN/g’s IA study guide each map to one core lesson, in the recommended order within Principles, Research and Navigation. Applied workshops are additional authored practice. Supplementary research guides are linked for further study; their entire reading collections are outside this course’s scope."}, {"id": "source-directory-2", "title": "Principles readings 1", "body": "1. [The Difference Between Information Architecture (IA) and Navigation](https://www.nngroup.com/articles/ia-vs-navigation/)\n\n2. [Information Architecture: 3 Key Models (Video)](https://www.nngroup.com/videos/information-architecture-models/)\n\n3. [Findability vs. Discoverability (Video)](https://www.nngroup.com/videos/findability-vs-discoverability/)"}, {"id": "source-directory-3", "title": "Principles readings 2", "body": "4. [Information Scent: How Users Decide Where to Go Next](https://www.nngroup.com/articles/information-scent/)\n\n5. [Search Box vs. Navigation (Video)](https://www.nngroup.com/videos/search-box-vs-navigation/)\n\n6. [How Many Items in a Navigation Menu? (Video)](https://www.nngroup.com/videos/number-items-navigation-menu/)"}, {"id": "source-directory-4", "title": "Principles readings 3", "body": "7. [Flat vs. Deep Website Hierarchies](https://www.nngroup.com/articles/flat-vs-deep-hierarchy/)\n\n8. [Top 10 Information Architecture (IA) Mistakes](https://www.nngroup.com/articles/top-10-ia-mistakes/)\n\n9. [Top 3 IA Questions about Navigation Menus](https://www.nngroup.com/articles/ia-questions-navigation-menus/)"}, {"id": "source-directory-5", "title": "Principles readings 4", "body": "10. [The 3-Click Rule for Navigation Is False](https://www.nngroup.com/articles/3-click-rule/)\n\n11. [Polyhierarchies Improve Findability for Ambiguous IA Categories](https://www.nngroup.com/articles/polyhierarchy/)\n\n12. [Polyhierarchy in Information Architecture (Video)](https://www.nngroup.com/videos/polyhierarchy-information-architecture/)"}, {"id": "source-directory-6", "title": "Principles readings 5", "body": "13. [How to Handle Category Outliers in Your IA](https://www.nngroup.com/articles/ia-category-outliers/)\n\n14. [Better Labels for Website Links: the 4 Ss for Encouraging clicks (Video)](https://www.nngroup.com/videos/better-link-labels/)\n\n15. [“Learn More” Links: You Can Do Better](https://www.nngroup.com/articles/learn-more-links/)"}, {"id": "source-directory-7", "title": "Principles readings 6", "body": "16. [3 Common IA Mistakes (that Are All Due to Low Information Scent)](https://www.nngroup.com/articles/3-ia-mistakes/)\n\n17. [Taxonomy 101: Definition, Best Practices, and How It Complements Other IA Work](https://www.nngroup.com/articles/taxonomy-101/)"}, {"id": "source-directory-8", "title": "Research readings 1", "body": "18. [Card Sorting: Uncover Users' Mental Models](https://www.nngroup.com/articles/card-sorting-definition/)\n\n19. [Open vs. Closed Card Sorting (Video)](https://www.nngroup.com/videos/open-vs-closed-card-sorting/)\n\n20. [Card Sorting: Pushing Users Beyond Terminology Matches](https://www.nngroup.com/articles/card-sorting-terminology-matches/)"}, {"id": "source-directory-9", "title": "Research readings 2", "body": "21. [Card Sorting: How Many Users to Test](https://www.nngroup.com/articles/card-sorting-how-many-users-to-test/)\n\n22. [How to Avoid Bias in Card Sorting (Video)](https://www.nngroup.com/videos/bias-card-sorting/)\n\n23. [How to Interpret Dendrograms from Card Sorting to Improve Information Architecture (Video)](https://www.nngroup.com/videos/ia-dendrogram/)"}, {"id": "source-directory-10", "title": "Research readings 3", "body": "24. [Tree Testing to Evaluate Information Architecture Categories (Video)](https://www.nngroup.com/videos/tree-testing/)\n\n25. [Tree Testing: Evaluate Menu Labels and Categories](https://www.nngroup.com/articles/tree-testing/)\n\n26. [Tree Testing Part 2: Interpreting the Results](https://www.nngroup.com/articles/interpreting-tree-test-results/)"}, {"id": "source-directory-11", "title": "Research readings 4", "body": "27. [Low Findability and Discoverability: Four Testing Methods to Identify the Causes](https://www.nngroup.com/articles/navigation-ia-tests/)"}, {"id": "source-directory-12", "title": "Navigation readings 1", "body": "28. [Menu-Design Checklist: 17 UX Guidelines](https://www.nngroup.com/articles/menu-design/)\n\n29. [Navigation Menus - 5 Tips to Make Them Visible (Video)](https://www.nngroup.com/videos/navigation-menu-visibility/)\n\n30. [Hamburger Menus and Hidden Navigation Hurt UX Metrics](https://www.nngroup.com/articles/hamburger-menus/)"}, {"id": "source-directory-13", "title": "Navigation readings 2", "body": "31. [Killing Off the Global Navigation: One Trend to Avoid | Nielsen Norman Group](https://www.nngroup.com/articles/killing-global-navigation-one-trend-avoid/)\n\n32. [Audience-Based Website Navigation (Video)](https://www.nngroup.com/videos/audience-based-website-navigation/)\n\n33. [Navigation: You Are Here](https://www.nngroup.com/articles/navigation-you-are-here/)"}, {"id": "source-directory-14", "title": "Navigation readings 3", "body": "34. [Digital Wayfinding (Video)](https://www.nngroup.com/videos/digital-wayfinding/)\n\n35. [Breadcrumbs: 11 Design Guidelines for Desktop and Mobile](https://www.nngroup.com/articles/breadcrumbs/)\n\n36. [Local Navigation Is a Valuable Orientation and Wayfinding Aid](https://www.nngroup.com/articles/local-navigation/)"}, {"id": "source-directory-15", "title": "Navigation readings 4", "body": "37. [Sticky Headers: 5 Ways to Make Them Better](https://www.nngroup.com/articles/sticky-headers/)\n\n38. [Left-Side Vertical Navigation on Desktop: Scalable, Responsive, and Easy to Scan](https://www.nngroup.com/articles/vertical-nav/)\n\n39. [Vertical Navigation (Video)](https://www.nngroup.com/videos/vertical-navigation/)"}, {"id": "source-directory-16", "title": "Navigation readings 5", "body": "40. [Utility Navigation: What It Is and How to Design It](https://www.nngroup.com/articles/utility-navigation/)\n\n41. [Web Page Footers 101: Design Patterns and When to Use Each](https://www.nngroup.com/articles/footers/)\n\n42. [Mega Menus Work Well for Site Navigation](https://www.nngroup.com/articles/mega-menus-work-well/)"}, {"id": "source-directory-17", "title": "Navigation readings 6", "body": "43. [Centered Logos Hurt Website Navigation](https://www.nngroup.com/articles/centered-logos/)\n\n44. [Basic Patterns for Mobile Navigation](https://www.nngroup.com/articles/mobile-navigation-patterns/)\n\n45. [Mobile Subnavigation](https://www.nngroup.com/articles/mobile-subnavigation/)"}, {"id": "source-directory-18", "title": "Navigation readings 7", "body": "46. [Accordion Icons: Which Signifiers Work Best?](https://www.nngroup.com/articles/accordion-icons/)"}, {"id": "source-directory-19", "title": "Further research guides", "body": "[Information Architecture: Study Guide](https://www.nngroup.com/articles/ia-study-guide/)\n\n[Qualitative Usability Testing: Study Guide](https://www.nngroup.com/articles/qual-usability-testing-study-guide/)\n\n[Quantitative User Research: Study Guide](https://www.nngroup.com/articles/quantitative-research-study-guide/)"}, {"id": "source-directory-20", "title": "Review notes", "body": "Sources checked 19 October 2026. The menu checklist now has 17 items although the study guide still says 15. Video summaries were available, not transcripts. The accordion-icon article was available through an indexed excerpt when its direct page failed. Read originals for their full evidence, examples and qualifications."}], "sourceIds": []}]}], "settings": {"passScore": 80, "allowRetakes": true, "showLessonDetails": false, "unlockAll": true, "sequential": false, "requireLessons": true, "brand": "#1d70b8", "background": "#ffffff", "surface": "#f3f2f1", "text": "#0b0c0c", "muted": "#505a5f", "border": "#b1b4b6", "fontScale": 1, "spacing": 24, "contentWidth": 850, "radius": 2, "font": "system", "headingFont": "system", "lineHeight": 1.6}, "finalQuiz": {"id": "ia-final", "type": "quiz", "title": "Final scenario review", "skill": "Final scenario review", "questions": [{"id": "ia-final-q1", "prompt": "A site’s departments are clear to staff but confusing to newcomers. First:", "options": ["Make department names more prominent", "Investigate newcomer tasks and vocabulary", "Copy the organisation chart into the menu"], "answer": 1, "explanation": "Research the audience’s expectations before committing to internal categories."}, {"id": "ia-final-q2", "prompt": "A category gets many clicks but people abandon its page. What can you infer?", "options": ["The route needs investigation; clicks alone do not establish success", "The category is definitely correctly named", "The destination must have too many paragraphs"], "answer": 0, "explanation": "Compare expectations, destination content and task outcomes."}, {"id": "ia-final-q3", "prompt": "A new workshop fits two subjects and has one date record. Implement:", "options": ["Two independent records with manually synchronised dates", "A separate website for each subject", "One maintained record with justified alternate relationships"], "answer": 2, "explanation": "Multiple routes should not create conflicting content copies."}, {"id": "ia-final-q4", "prompt": "You want to know how learners group preparation and payment information. Choose:", "options": ["A count of total pages", "A representative card sort with neutral wording", "An aesthetic preference poll about colours"], "answer": 1, "explanation": "Grouping expectations require evidence about the content concepts."}, {"id": "ia-final-q5", "prompt": "Most tree-test users choose the wrong first category. Investigate:", "options": ["Top-level expectations, scope and labels", "Only the final-page button spacing", "Only how the footer logo is centred"], "answer": 0, "explanation": "First choices help locate the structural uncertainty."}, {"id": "ia-final-q6", "prompt": "One tree succeeds for 7 of 10; another for 8 of 10. Conclude:", "options": ["The second is proven better for the whole population", "Both have identical causes of failure", "More evidence and appropriate analysis are needed for a reliable comparison"], "answer": 2, "explanation": "A small numerical difference is not automatically meaningful."}, {"id": "ia-final-q7", "prompt": "A breadcrumb displays yesterday’s browsing sequence. It represents:", "options": ["The only valid breadcrumb approach", "History rather than the usual hierarchical location trail", "A complete taxonomy"], "answer": 1, "explanation": "A location trail and a session history serve different purposes."}, {"id": "ia-final-q8", "prompt": "Which desktop pattern might suit many descriptive categories?", "options": ["A readable vertical menu evaluated in context", "An arbitrary maximum of four vague labels", "A tiny unlabelled menu icon regardless of available space"], "answer": 0, "explanation": "Match the pattern to the content and tasks."}, {"id": "ia-final-q9", "prompt": "After a successful tree test, the next prototype hides its menu in an image. What remains?", "options": ["Only celebrating the tree result", "No validation; the IA test covers all UI decisions", "Interface visibility, operation and full task testing"], "answer": 2, "explanation": "Structure-only evidence cannot validate the visual controls."}, {"id": "ia-final-q10", "prompt": "How should a search result distinguish similarly named courses?", "options": ["Unverified claims that one is the best", "Useful metadata such as level, schedule and venue", "Identical Learn more links only"], "answer": 1, "explanation": "Relevant context helps visitors predict a match."}, {"id": "ia-final-q11", "prompt": "What makes an IA change maintainable?", "options": ["Named owners, rules, migration checks and review triggers", "A polished sitemap with no ownership", "Preventing all future content additions"], "answer": 0, "explanation": "Architecture needs decisions and review after launch."}, {"id": "ia-final-q12", "prompt": "What is a credible capstone conclusion?", "options": ["A quiz score proving universal professional competence", "The new site is perfect because it has fewer clicks", "What improved, the supporting evidence and what remains uncertain"], "answer": 2, "explanation": "Report outcomes and limits in proportion to the evidence."}]}}</script></body></html>
